<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#06324b">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Ocean Snake">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/ocean-snake-logo.ico" sizes="any">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&display=swap">
  <title>Ocean Snake</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #eaf6ff;
      --muted: #9fb0c5;
      --panel: rgba(6, 20, 32, 0.72);
      --line: rgba(126, 231, 255, 0.25);
      --line-soft: rgba(255, 255, 255, 0.10);
      --glow: rgba(126, 231, 255, 0.12);
      --radius-card: 14px;
      --radius-chip: 12px;
      --danger: #ff5f6d;
      --food: #ffcf5a;
      --snake: #35d6b4;
      --snake-dark: #0f5f63;
      --arena-a: #03131f;
      --arena-b: #06324b;
      --accent: #7ee7ff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 18% 10%, rgba(126, 231, 255, 0.16), transparent 29%),
        radial-gradient(circle at 82% 18%, rgba(53, 214, 180, 0.12), transparent 27%),
        linear-gradient(160deg, #02101b 0%, #05304b 48%, #020812 100%);
      color: var(--ink);
      font-family: Sora, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
      user-select: none;
      overscroll-behavior: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    .shell {
      position: fixed;
      inset: 0;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 12px;
      padding: clamp(12px, 2.2vw, 24px);
    }

    .topbar,
    .bottombar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 48px;
      z-index: 2;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-logo {
      width: clamp(48px, 6vw, 72px);
      height: clamp(48px, 6vw, 72px);
      flex: 0 0 auto;
      object-fit: contain;
      filter: drop-shadow(0 10px 16px rgba(0, 0, 0, 0.32));
      transform: translateY(2px);
    }

    h1 {
      margin: 0;
      font-size: clamp(1.35rem, 3.2vw, 2.6rem);
      line-height: 1;
      font-weight: 800;
      letter-spacing: 0.02em;
      white-space: nowrap;
      text-shadow: 0 4px 18px rgba(0, 0, 0, 0.28);
    }

    h1 .brand-accent {
      color: var(--accent);
    }

    .stats {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      flex-wrap: wrap;
    }

    .stat,
    .status,
    .icon-button {
      border: 1px solid var(--line-soft);
      background: var(--panel);
      backdrop-filter: blur(18px);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.06),
        0 10px 30px rgba(0, 0, 0, 0.35);
    }

    .stat {
      min-width: 82px;
      height: 44px;
      display: grid;
      place-items: center;
      padding: 4px 14px;
      border-radius: var(--radius-chip);
    }

    .stat--score {
      border-color: rgba(126, 231, 255, 0.3);
    }

    .stat span {
      display: block;
      color: var(--muted);
      font-size: 0.63rem;
      line-height: 1;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      font-weight: 600;
    }

    .stat strong {
      display: block;
      color: var(--ink);
      font-size: 1.2rem;
      line-height: 1.15;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .stat--best strong {
      color: var(--food);
    }

    .arena-wrap {
      min-height: 0;
      position: relative;
      display: grid;
      place-items: center;
    }

    canvas {
      display: block;
      width: min(100%, calc((100vh - 160px) * 1.45));
      height: min(100%, calc((100vw - 24px) / 1.45));
      max-width: 1180px;
      max-height: 760px;
      aspect-ratio: 1.45 / 1;
      border: 1px solid var(--line);
      border-radius: var(--radius-card);
      background: var(--arena-a);
      box-shadow:
        0 0 40px var(--glow),
        0 28px 90px rgba(0, 0, 0, 0.4);
      touch-action: none;
      cursor: grab;
    }

    canvas.dragging {
      cursor: grabbing;
    }

    .center-state {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      pointer-events: none;
      padding: 24px;
      text-align: center;
      z-index: 1;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.28s ease, visibility 0s linear 0.28s;
    }

    .center-state.visible {
      opacity: 1;
      visibility: visible;
      transition: opacity 0.28s ease;
    }

    .state-badge {
      width: min(460px, 82vw);
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(5, 16, 26, 0.78);
      backdrop-filter: blur(20px);
      padding: 18px 18px 16px;
      box-shadow:
        0 0 40px var(--glow),
        0 24px 60px rgba(0, 0, 0, 0.45);
      transform: scale(0.94) translateY(8px);
      transition: transform 0.32s cubic-bezier(0.22, 0.9, 0.3, 1);
    }

    .center-state.visible .state-badge {
      transform: scale(1) translateY(0);
    }

    .state-icon {
      width: 58px;
      height: 58px;
      margin: 0 auto 10px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: #05131d;
      background: var(--food);
      box-shadow: 0 0 0 8px rgba(255, 209, 102, 0.13);
    }

    .state-icon svg {
      width: 31px;
      height: 31px;
      stroke-width: 2.4;
      display: none;
    }

    .center-state .icon-play {
      display: block;
    }

    .center-state.state-pause .icon-play,
    .center-state.state-gameover .icon-play {
      display: none;
    }

    .center-state.state-pause .icon-pause {
      display: block;
    }

    .center-state.state-gameover .icon-over {
      display: block;
    }

    .center-state.state-pause .state-badge {
      border-color: rgba(126, 231, 255, 0.45);
    }

    .center-state.state-pause .state-icon {
      background: var(--accent);
      box-shadow: 0 0 0 8px rgba(126, 231, 255, 0.13);
    }

    .center-state.state-gameover .state-badge {
      border-color: rgba(255, 95, 109, 0.5);
      background: rgba(30, 8, 14, 0.8);
      box-shadow:
        0 0 40px rgba(255, 95, 109, 0.12),
        0 24px 60px rgba(0, 0, 0, 0.45);
    }

    .center-state.state-gameover .state-icon {
      background: var(--danger);
      box-shadow: 0 0 0 8px rgba(255, 95, 109, 0.14);
      color: #2a060c;
    }

    .state-badge h2 {
      margin: 0;
      font-size: clamp(1.25rem, 4vw, 2rem);
      line-height: 1.1;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-weight: 800;
    }

    .state-badge p {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.35;
      white-space: pre-line;
    }

    .state-score {
      display: none;
    }

    .center-state.state-gameover .state-score {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 14px;
    }

    .state-score .pill {
      border: 1px solid rgba(126, 231, 255, 0.3);
      border-radius: var(--radius-chip);
      background: var(--panel);
      padding: 7px 16px;
      font-size: 0.82rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-weight: 600;
    }

    .state-score .pill strong {
      color: var(--ink);
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      margin-left: 6px;
    }

    .state-score .pill.best {
      border-color: rgba(255, 207, 90, 0.35);
    }

    .state-score .pill.best strong {
      color: var(--food);
    }

    @media (prefers-reduced-motion: reduce) {
      .center-state,
      .state-badge {
        transition: none;
      }

      .dot {
        animation: none;
      }
    }

    .bottombar {
      min-height: 44px;
    }

    .status {
      min-height: 40px;
      border-radius: var(--radius-chip);
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      color: var(--muted);
      font-weight: 600;
      font-size: 0.9rem;
      line-height: 1.2;
      min-width: 0;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--snake);
      box-shadow: 0 0 12px rgba(49, 208, 170, 0.8);
      flex: 0 0 auto;
      animation: dot-breathe 2.6s ease-in-out infinite;
    }

    @keyframes dot-breathe {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.55; }
    }

    #statusText {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      flex: 0 0 auto;
    }

      .joystick {
        --joy-power: 0;
        --joy-glow-alpha: 0;
        --joy-ring-alpha: 0.08;
        display: none;
      }

    .icon-button {
      width: 44px;
      height: 44px;
      border-radius: var(--radius-chip);
      color: var(--ink);
      display: grid;
      place-items: center;
      padding: 0;
      cursor: pointer;
      transition: border-color 0.15s ease, color 0.15s ease, box-shadow 0.15s ease;
    }

    .icon-button:hover {
      border-color: var(--line);
      color: var(--accent);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.06),
        0 0 14px var(--glow),
        0 10px 30px rgba(0, 0, 0, 0.35);
    }

    .icon-button:active {
      transform: translateY(1px);
    }

    .icon-button[hidden] {
      display: none;
    }

    .icon-button svg {
      width: 21px;
      height: 21px;
      stroke-width: 2.2;
      pointer-events: none;
    }

    @media (max-width: 760px), (pointer: coarse) {
      html,
      body {
        position: fixed;
        inset: 0;
        height: 100%;
        overflow: hidden;
      }

      .shell {
        height: 100vh;
        height: 100svh;
        grid-template-rows: auto minmax(0, 1fr) auto;
        gap: 8px;
        padding:
          calc(8px + env(safe-area-inset-top))
          calc(8px + env(safe-area-inset-right))
          calc(8px + env(safe-area-inset-bottom))
          calc(8px + env(safe-area-inset-left));
      }

      .topbar,
      .bottombar {
        min-height: 44px;
        gap: 8px;
      }

      .topbar {
        align-items: center;
      }

      .brand {
        flex: 1 1 auto;
        gap: 8px;
      }

      .brand-logo {
        width: 42px;
        height: 42px;
        transform: translateY(1px);
      }

      h1 {
        font-size: clamp(1.1rem, 5.6vw, 1.6rem);
        white-space: nowrap;
      }

      .stats {
        flex: 0 0 auto;
        gap: 6px;
        flex-wrap: nowrap;
      }

      .stat {
        min-width: 58px;
        height: 36px;
        padding: 3px 7px;
      }

      .stat span {
        font-size: 0.58rem;
      }

      .stat strong {
        font-size: 0.96rem;
      }

      .arena-wrap {
        align-items: stretch;
        justify-items: stretch;
      }

      canvas {
        width: 100%;
        height: 100%;
        max-width: none;
        max-height: none;
        aspect-ratio: auto;
        box-shadow: 0 16px 46px rgba(0, 0, 0, 0.32);
        cursor: default;
      }

      .center-state {
        padding: 10px;
      }

      .state-badge {
        width: min(340px, 88vw);
        max-height: calc(100% - 20px);
        overflow: auto;
        padding: 14px 14px 12px;
      }

      .state-icon {
        width: 46px;
        height: 46px;
        margin-bottom: 8px;
      }

      .state-icon svg {
        width: 25px;
        height: 25px;
      }

      .state-badge h2 {
        font-size: clamp(1.1rem, 6vw, 1.45rem);
      }

      .state-badge p {
        font-size: 0.78rem;
        line-height: 1.28;
      }

      .bottombar {
        display: grid;
        grid-template-columns: 116px minmax(0, 1fr);
        grid-template-rows: auto auto;
        align-items: center;
        min-height: 124px;
      }

      .status {
        grid-column: 2;
        grid-row: 1;
        flex: 1 1 auto;
        max-width: none;
        min-height: 42px;
        font-size: 0.74rem;
        padding: 7px 9px;
      }

      .joystick {
        grid-column: 1;
        grid-row: 1 / span 2;
        width: 110px;
        height: 110px;
        display: grid;
        place-items: center;
        touch-action: none;
        align-self: center;
        justify-self: start;
      }

      .joystick-ring {
        width: 104px;
        height: 104px;
        border-radius: 50%;
        border: 1px solid var(--line);
        background:
          radial-gradient(circle at 50% 50%, rgba(255, 207, 90, var(--joy-glow-alpha)), transparent 31%),
          radial-gradient(circle at 50% 50%, rgba(126, 231, 255, 0.14), transparent 42%),
          rgba(5, 22, 34, 0.72);
        box-shadow:
          inset 0 0 0 1px rgba(255, 255, 255, 0.07),
          inset 0 0 calc(18px + var(--joy-power) * 22px) rgba(126, 231, 255, var(--joy-ring-alpha)),
          0 14px 32px rgba(0, 0, 0, 0.26),
          0 0 calc(var(--joy-power) * 28px) rgba(255, 207, 90, 0.36);
        position: relative;
      }

      .joystick-ring::before,
      .joystick-ring::after {
        content: "";
        position: absolute;
        inset: 50% auto auto 50%;
        background: rgba(247, 251, 255, 0.18);
        transform: translate(-50%, -50%);
        border-radius: 999px;
        pointer-events: none;
      }

      .joystick-ring::before {
        width: 54%;
        height: 1px;
      }

      .joystick-ring::after {
        width: 1px;
        height: 54%;
      }

      .joystick-thumb {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        position: absolute;
        left: 50%;
        top: 50%;
        margin-left: -21px;
        margin-top: -21px;
        background: linear-gradient(145deg, #7ee7ff, #35d6b4 64%, #ffcf5a);
        box-shadow:
          0 10px 22px rgba(0, 0, 0, 0.3),
          0 0 calc(18px + var(--joy-power) * 20px) rgba(126, 231, 255, 0.34),
          0 0 calc(var(--joy-power) * 18px) rgba(255, 207, 90, 0.45);
        transform: translate(0, 0);
        transition: transform 120ms ease;
      }

      .joystick.active .joystick-thumb {
        transition: none;
      }

      .joystick.active .joystick-ring {
        border-color: rgba(255, 207, 90, 0.48);
      }

      .controls {
        grid-column: 2;
        grid-row: 2;
        gap: 4px;
        justify-content: flex-end;
      }

      .icon-button {
        width: 40px;
        height: 40px;
      }
    }

    @media (max-height: 540px) and (pointer: coarse) {
      .shell {
        gap: 6px;
        padding:
          calc(6px + env(safe-area-inset-top))
          calc(6px + env(safe-area-inset-right))
          calc(6px + env(safe-area-inset-bottom))
          calc(6px + env(safe-area-inset-left));
      }

      .topbar {
        min-height: 38px;
      }

      .mark {
        width: 28px;
        height: 28px;
      }

      h1 {
        font-size: 1.05rem;
      }

      .stat {
        min-width: 54px;
        height: 34px;
      }

      .bottombar {
        grid-template-columns: 88px minmax(0, 1fr);
        min-height: 88px;
      }

      .status {
        display: none;
      }

      .joystick {
        width: 84px;
        height: 84px;
      }

      .joystick-ring {
        width: 78px;
        height: 78px;
      }

      .joystick-thumb {
        width: 34px;
        height: 34px;
        margin-left: -17px;
        margin-top: -17px;
      }

      .controls {
        grid-row: 1 / span 2;
        align-self: center;
      }

      .icon-button {
        width: 40px;
        height: 40px;
      }

      .state-icon {
        display: none;
      }

      .state-badge {
        width: min(360px, 86vw);
        padding: 10px 12px;
      }

      .state-badge p {
        font-size: 0.72rem;
      }
    }
  </style>
</head>
<body>
  <main class="shell" aria-label="Ocean Snake game">
    <header class="topbar">
      <div class="brand" aria-label="Ocean Snake">
        <img class="brand-logo" src="assets/ocean-snake-logo-header.png" alt="" width="512" height="512" aria-hidden="true">
        <h1>Ocean <span class="brand-accent">Snake</span></h1>
      </div>
      <div class="stats" aria-live="polite">
        <div class="stat stat--score" aria-label="Score">
          <span>Score</span>
          <strong id="score">0</strong>
        </div>
        <div class="stat stat--best" aria-label="Best score">
          <span>Best</span>
          <strong id="best">0</strong>
        </div>
      </div>
    </header>

    <section class="arena-wrap">
      <canvas id="game" width="1160" height="800" aria-label="Snake arena"></canvas>
      <div class="center-state" id="centerState">
        <div class="state-badge">
          <div class="state-icon" aria-hidden="true">
            <svg class="icon-play" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 3l14 8-6 2-2 6L5 3z"></path>
            </svg>
            <svg class="icon-pause" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 5v14"></path>
              <path d="M15 5v14"></path>
            </svg>
            <svg class="icon-over" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="9"></circle>
              <path d="M8.5 9.5l2 2m0-2l-2 2"></path>
              <path d="M13.5 9.5l2 2m0-2l-2 2"></path>
              <path d="M8.5 15.5c1-1 2.2-1.5 3.5-1.5s2.5.5 3.5 1.5"></path>
            </svg>
          </div>
          <h2 id="stateTitle">Ready</h2>
          <p id="stateCopy">The first bite is waiting.</p>
          <div class="state-score" aria-hidden="true">
            <span class="pill">Score<strong id="finalScore">0</strong></span>
            <span class="pill best">Best<strong id="finalBest">0</strong></span>
          </div>
        </div>
      </div>
    </section>

    <footer class="bottombar">
      <div class="joystick" id="joystick" role="application" aria-label="Virtual joystick">
        <div class="joystick-ring" aria-hidden="true">
          <div class="joystick-thumb" id="joystickThumb"></div>
        </div>
      </div>
      <div class="status" aria-live="polite">
        <span class="dot" id="statusDot"></span>
        <span id="statusText">Waiting at the start line</span>
      </div>
      <div class="controls">
        <button class="icon-button" id="pauseBtn" type="button" aria-label="Pause" title="Pause">
          <svg id="pauseIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 5v14"></path>
            <path d="M16 5v14"></path>
          </svg>
        </button>
        <button class="icon-button" id="muteBtn" type="button" aria-label="Mute" title="Mute">
          <svg id="muteIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 5 6 9H3v6h3l5 4V5z"></path>
            <path d="M15.5 8.5a5 5 0 0 1 0 7"></path>
            <path d="M18.5 5.5a9 9 0 0 1 0 13"></path>
          </svg>
        </button>
        <button class="icon-button" id="hapticsBtn" type="button" aria-label="Disable haptics" title="Disable haptics" hidden>
          <svg id="hapticsIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <rect x="7" y="4" width="10" height="16" rx="2"></rect>
            <path d="M4 9v6"></path>
            <path d="M20 9v6"></path>
          </svg>
        </button>
        <button class="icon-button" id="dualSenseBtn" type="button" aria-label="Enable DualSense touchpad" title="Enable DualSense touchpad" aria-pressed="false" hidden>
          <svg id="dualSenseIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <path d="M7 8h10a4 4 0 0 1 3.7 2.5l1.1 3.1a3 3 0 0 1-4.8 3.3L15 15h-6l-2 1.9a3 3 0 0 1-4.8-3.3l1.1-3.1A4 4 0 0 1 7 8z"></path>
            <path d="M8 11v3"></path><path d="M6.5 12.5h3"></path><path d="M15.5 12h.01"></path><path d="M18 14h.01"></path>
          </svg>
        </button>
        <button class="icon-button" id="restartBtn" type="button" aria-label="Restart" title="Restart">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 1 0 3-6.7"></path>

      function buildStamp() {
        return `Build ${BUILD_NUMBER}. ${BUILD_DATE}`;
      }

      function addBuildStamp(copy) {
        return `${copy}\n\n${buildStamp()}`;
      }

      function introCopy() {
        return addBuildStamp(isMobileLayout() ? MOBILE_INTRO_COPY : DESKTOP_INTRO_COPY);
      }

      function initialSnakeLength() {
        if (!isMobileLayout()) return START_LENGTH;

        const gap = segmentGap();
        const usableWidth = Math.max(0, ARENA.width - headRadius() * 2 - 56);
        return Math.max(12, Math.min(START_LENGTH, Math.floor(usableWidth / gap) + 1));
      }

      function clampArenaPoint(point, margin = headRadius()) {
        return {
          x: clamp(point.x, margin, Math.max(margin, ARENA.width - margin)),
          y: clamp(point.y, margin, Math.max(margin, ARENA.height - margin))
        };
      }

      function scalePointToArena(point, scaleX, scaleY, margin = 0) {
        if (!point) return;
        point.x = clamp(point.x * scaleX, margin, Math.max(margin, ARENA.width - margin));
        point.y = clamp(point.y * scaleY, margin, Math.max(margin, ARENA.height - margin));
      }

      function scaleWorld(previousArena) {
        if (!previousArena.width || !previousArena.height || !snake) return;

        const scaleX = ARENA.width / previousArena.width;
        const scaleY = ARENA.height / previousArena.height;
        snake.forEach((part) => scalePointToArena(part, scaleX, scaleY, headRadius()));
        scalePointToArena(food, scaleX, scaleY, foodRadius());
        scalePointToArena(bonusFood, scaleX, scaleY, bonusRadius());
        scalePointToArena(target, scaleX, scaleY, headRadius());

        if (oceanParticles) {
          oceanParticles.forEach((particle) => scalePointToArena(particle, scaleX, scaleY));
        }
        if (biteParticles) {
          biteParticles.forEach((particle) => scalePointToArena(particle, scaleX, scaleY));
        }
        if (scorePopups) {
          scorePopups.forEach((popup) => scalePointToArena(popup, scaleX, scaleY));
        }
        if (bgFish) {
          bgFish = [];
          nextFishSchoolAt = (pulse || 0) + rnd(4, 10);
        }
      }

      function syncArenaSize() {
        const rect = canvas.getBoundingClientRect();
        const next = isMobileLayout()
          ? {
              width: Math.max(1, Math.round(rect.width)),
              height: Math.max(1, Math.round(rect.height))
            }
          : DESKTOP_ARENA;
        const nextRenderDpr = clamp(window.devicePixelRatio || 1, 1, MAX_RENDER_DPR);
        const nextBackingWidth = Math.max(1, Math.round(next.width * nextRenderDpr));
        const nextBackingHeight = Math.max(1, Math.round(next.height * nextRenderDpr));
        const logicalSizeChanged =
          Math.abs(ARENA.width - next.width) >= 2 ||
          Math.abs(ARENA.height - next.height) >= 2;
        const backingSizeChanged =
          canvas.width !== nextBackingWidth ||
          canvas.height !== nextBackingHeight;

        if (!logicalSizeChanged && !backingSizeChanged && renderDpr === nextRenderDpr) {
          return;
        }

        const previousArena = { width: ARENA.width, height: ARENA.height };
        ARENA.width = next.width;
        ARENA.height = next.height;
        renderDpr = nextRenderDpr;
        canvas.width = nextBackingWidth;
        canvas.height = nextBackingHeight;
        ctx.setTransform(renderDpr, 0, 0, renderDpr, 0, 0);

        if (logicalSizeChanged) {
          scaleWorld(previousArena);
        }
        if (logicalSizeChanged && typeof foodLevel === "number") {
          updateOceanFlow(true);
        }
      }

      function scheduleArenaSync() {
        if (resizeFrame) cancelAnimationFrame(resizeFrame);
        resizeFrame = requestAnimationFrame(() => {
          resizeFrame = null;
          syncArenaSize();
        });
      }

      function musicConfig(mode = musicMode || "normal") {
        return mode === "invincible"
          ? {
              url: INVINCIBLE_MUSIC_URL,
              credit: INVINCIBLE_MUSIC_CREDIT,
              volume: 0.12
            }
          : {
              url: BACKGROUND_MUSIC_URL,
              credit: BACKGROUND_MUSIC_CREDIT,
              volume: 0.16
            };
      }

      function createMusicTrack(mode) {
        const config = musicConfig(mode);
        const track = new Audio(config.url);
        track.loop = true;
        track.preload = "auto";
        track.volume = config.volume;
        track.title = config.credit;
        track.setAttribute("playsinline", "");
        track.setAttribute("webkit-playsinline", "");
        track.addEventListener("error", syncAmbientFallback);
        track.addEventListener("canplay", () => {
          track.oceanSnakeStalled = false;
          syncAmbientFallback();
        });
        return track;
      }

      function ensureMusicTracks() {
        if (musicTracks) return;
        musicTracks = {
          normal: createMusicTrack("normal"),
          invincible: createMusicTrack("invincible")
        };
      }

      function unlockInvincibleMusicTrack() {
        if (invincibleMusicUnlocked || muted) return;
        ensureMusicTracks();
        const track = musicTracks.invincible;
        track.muted = true;
        track.play()
          .then(() => {
            track.pause();
            track.currentTime = 0;
            track.muted = muted;
            invincibleMusicUnlocked = true;
          })
          .catch(() => {
            track.muted = muted;
          });
      }

      function cancelMusicFade() {
        if (!musicFadeFrame) return;
        cancelAnimationFrame(musicFadeFrame);
        musicFadeFrame = null;
      }

      function fadeMusicTo(volume, seconds) {
        if (!currentMusicTrack) return;
        cancelMusicFade();

        const track = currentMusicTrack;
        const startVolume = track.volume;
        const startTime = performance.now();
        const duration = seconds * 1000;

        const step = (now) => {
          if (track !== currentMusicTrack) return;

          const progress = Math.min(1, (now - startTime) / duration);
          const eased = 1 - Math.pow(1 - progress, 3);
          track.volume = lerp(startVolume, volume, eased);

          if (progress < 1) {
            musicFadeFrame = requestAnimationFrame(step);
          } else {
            musicFadeFrame = null;
          }
        };

        musicFadeFrame = requestAnimationFrame(step);
      }

      function ensureMusicTrack(mode = musicMode || "normal", fadeIn = false) {
        ensureMusicTracks();
        const config = musicConfig(mode);
        if (currentMusicTrack && musicMode === mode) return;
        cancelMusicFade();

        if (currentMusicTrack) {
          currentMusicTrack.pause();
        }

        currentMusicTrack = musicTracks[mode];
        currentMusicTrack.volume = fadeIn ? 0 : config.volume;
        currentMusicTrack.muted = muted;
        musicMode = mode;
      }

      function switchMusic(mode) {
        if (musicMode === mode) return;
        const fromInvincible = musicMode === "invincible";
        const canPlay = musicStarted && !muted && !paused && !document.hidden;
        const fadeIn = canPlay && (mode === "invincible" || fromInvincible);
        const config = musicConfig(mode);
        ensureMusicTrack(mode, fadeIn);
        currentMusicTrack.playbackRate = 1;
        if (canPlay) {
          currentMusicTrack.currentTime = 0;
          currentMusicTrack.play().catch(() => {});
          if (fadeIn) {
            fadeMusicTo(config.volume, mode === "invincible" ? INVINCIBLE_MUSIC_FADE_SECONDS : NORMAL_MUSIC_FADE_SECONDS);
          }
          scheduleMusicStallCheck();
        }
        syncAmbientFallback();
      }

      function startMusic() {
        musicStarted = true;
        ensureMusicTracks();
        unlockInvincibleMusicTrack();
        if (muted || paused || document.hidden) return;
        ensureMusicTrack();
        currentMusicTrack.muted = false;
        currentMusicTrack.play().catch(() => {});
        scheduleMusicStallCheck();
        syncAmbientFallback();
      }

      function suspendGameAudio() {
        cancelMusicFade();
        if (musicTracks) {
          Object.values(musicTracks).forEach((track) => track.pause());
        }
        if (audioCtx && audioCtx.state === "running") {
          try {
            const suspendAttempt = audioCtx.suspend();
            if (suspendAttempt && typeof suspendAttempt.catch === "function") {
              suspendAttempt.catch(() => {});
            }
          } catch (error) {}
        }
      }

      function resumeGameAudio() {
        if (muted || paused || document.hidden) return;
        resumeAudioContext();
        if (!musicStarted) return;
        ensureMusicTrack();
        if (musicMode !== "invincible") {
          unlockInvincibleMusicTrack();
        }
        currentMusicTrack.muted = false;
        currentMusicTrack.volume = musicConfig().volume;
        currentMusicTrack.play().catch(() => {});
        scheduleMusicStallCheck();
        syncAmbientFallback();
      }

      function syncMusicMute() {
        updateMuteIcon();
        syncAmbientFallback();
        ensureMusicTracks();
        Object.values(musicTracks).forEach((track) => {
          track.muted = muted;
        });
        if (muted || paused || document.hidden) {
          suspendGameAudio();
          return;
        }
        resumeGameAudio();
      }

      function stopMusic() {
        musicStarted = false;
        cancelMusicFade();
        if (musicStallTimer) {
          clearTimeout(musicStallTimer);
          musicStallTimer = null;
        }
        syncAmbientFallback();
        if (!musicTracks) return;
        Object.values(musicTracks).forEach((track) => {
          track.pause();
          track.currentTime = 0;
          track.playbackRate = 1;
        });
        currentMusicTrack = musicTracks.normal;
        musicMode = "normal";
      }

      function currentMusicUnavailable() {
        const track = currentMusicTrack || (musicTracks && musicTracks[musicMode || "normal"]);
        return !!track && (!!track.error || !!track.oceanSnakeStalled);
      }

      function scheduleMusicStallCheck() {
        if (musicStallTimer) clearTimeout(musicStallTimer);
        musicStallTimer = setTimeout(() => {
          musicStallTimer = null;
          const track = currentMusicTrack;
          if (musicStarted && track && !track.error && track.readyState < 2) {
            track.oceanSnakeStalled = true;
          }
          syncAmbientFallback();
        }, MUSIC_STALL_TIMEOUT_MS);
      }

      function applyAmbientMode() {
        if (!ambientNodes || !audioCtx) return;
        try {
          const invincible = musicMode === "invincible";
          const now = audioCtx.currentTime;
          ambientNodes.filter.frequency.setTargetAtTime(invincible ? 1250 : 620, now, 0.4);
          ambientNodes.lfo.frequency.setTargetAtTime(invincible ? 0.22 : 0.06, now, 0.4);
        } catch (error) {}
      }

      function startAmbientLoop() {
        if (ambientNodes) return;
        try {
          if (!ensureAudioContext()) return;
          resumeAudioContext();
          const now = audioCtx.currentTime;
          const master = audioCtx.createGain();
          master.gain.setValueAtTime(0.0001, now);
          master.gain.exponentialRampToValueAtTime(AMBIENT_FALLBACK_VOLUME, now + 2.4);

          const filter = audioCtx.createBiquadFilter();
          filter.type = "lowpass";
          filter.frequency.setValueAtTime(620, now);
          filter.Q.setValueAtTime(0.6, now);
          filter.connect(master).connect(audioCtx.destination);

          const lfo = audioCtx.createOscillator();
          const lfoGain = audioCtx.createGain();
          lfo.frequency.setValueAtTime(0.06, now);
          lfoGain.gain.setValueAtTime(180, now);
          lfo.connect(lfoGain).connect(filter.frequency);
          lfo.start(now);

          const voices = [55, 82.41, 110, 164.81].map((frequency, index) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = index % 2 ? "triangle" : "sine";
            osc.frequency.setValueAtTime(frequency, now);
            osc.detune.setValueAtTime((index - 1.5) * 5, now);
            gain.gain.setValueAtTime(0.22 - index * 0.035, now);
            osc.connect(gain).connect(filter);
            osc.start(now);
            return osc;
          });

          ambientNodes = { master, filter, lfo, voices };
          applyAmbientMode();
        } catch (error) {
          ambientNodes = null;
        }
      }

      function stopAmbientLoop() {
        if (!ambientNodes) return;
        const nodes = ambientNodes;
        ambientNodes = null;
        try {
          const now = audioCtx.currentTime;
          nodes.master.gain.cancelScheduledValues(now);
          nodes.master.gain.setValueAtTime(Math.max(0.0001, nodes.master.gain.value), now);
          nodes.master.gain.exponentialRampToValueAtTime(0.0001, now + 0.5);
        } catch (error) {}
        setTimeout(() => {
          try {
            nodes.voices.forEach((osc) => osc.stop());
            nodes.lfo.stop();
            nodes.master.disconnect();
          } catch (error) {}
        }, 600);
      }

      function syncAmbientFallback() {
        if (musicStarted && !muted && !paused && !document.hidden && currentMusicUnavailable()) {
          startAmbientLoop();
          applyAmbientMode();
        } else {
          stopAmbientLoop();
        }
      }

      function getCanvasPoint(event) {
        const rect = canvas.getBoundingClientRect();
        return {
          x: (event.clientX - rect.left) * ARENA.width / rect.width,
          y: (event.clientY - rect.top) * ARENA.height / rect.height
        };
      }

      function isOnHead(point, event) {
        return dist(point, snake[0]) <= headGrabRadius(event);
      }

      function resetJoystick() {
        joystickActive = false;
        joystickPointerId = null;
        joystickVector = { x: 0, y: 0 };
        joystickPower = 0;
        joystick.classList.remove("active");
        joystick.style.setProperty("--joy-power", "0");
        joystick.style.setProperty("--joy-glow-alpha", "0");
        joystick.style.setProperty("--joy-ring-alpha", "0.08");
        joystickThumb.style.transform = "translate(0px, 0px)";
      }

      function resetGamepadControl(updateStatus = false) {
        const wasActive = gamepadActive;
        gamepadActive = false;
        gamepadVector = { x: 0, y: 0 };
        gamepadPower = 0;
        if (updateStatus && wasActive && gameState === "playing" && !paused) {
          setStatus("Coasting", "#8bd3ff");
        }
      }

      function resetControllerTouch(updateStatus = false, source = null) {
        if (source && controllerTouchState.source !== source) return;
        const wasActive = controllerTouchState.active;
        controllerTouchState = {
          source: null,
          touchId: null,
          x: 0.5,
          y: 0.5,
          anchorX: 0.5,
          anchorY: 0.5,
          anchorTargetX: 0,
          anchorTargetY: 0,
          active: false,
          lastTimestamp: 0
        };
        if (updateStatus && wasActive && gameState === "playing" && !paused) {
          setStatus("Coasting", "#8bd3ff");
        }
      }

      function controllerTouchRelativePoint(state) {
        const margin = headRadius();
        const usableWidth = Math.max(0, ARENA.width - margin * 2);
        const usableHeight = Math.max(0, ARENA.height - margin * 2);
        return clampArenaPoint({
          x: state.anchorTargetX + (state.x - state.anchorX) * usableWidth,
          y: state.anchorTargetY + (state.y - state.anchorY) * usableHeight
        }, margin);
      }

      function updateControllerTouch(source, touchId, x, y) {
        if (
          controllerTouchState.active &&
          (controllerTouchState.source !== source || controllerTouchState.touchId !== touchId)
        ) {
          return false;
        }

        const firstContact = !controllerTouchState.active;
        if (gameState === "over" && !firstContact) {
          controllerTouchState.x = clamp(x, 0, 1);
          controllerTouchState.y = clamp(y, 0, 1);
          controllerTouchState.lastTimestamp = performance.now();
          return true;
        }
        if (gameState === "over") reset();

        const normalizedX = clamp(x, 0, 1);
        const normalizedY = clamp(y, 0, 1);
        const anchorTarget = firstContact ? { ...snake[0] } : {
          x: controllerTouchState.anchorTargetX,
          y: controllerTouchState.anchorTargetY
        };
        controllerTouchState = {
          source,
          touchId,
          x: normalizedX,
          y: normalizedY,
          anchorX: firstContact ? normalizedX : controllerTouchState.anchorX,
          anchorY: firstContact ? normalizedY : controllerTouchState.anchorY,
          anchorTargetX: anchorTarget.x,
          anchorTargetY: anchorTarget.y,
          active: true,
          lastTimestamp: performance.now()
        };
        lastControlSource = "gamepad";

        if (joystickActive || paused) return true;

        cancelCanvasDrag();
        resetGamepadControl();
        target = controllerTouchRelativePoint(controllerTouchState);
        startPlaying();
        if (firstContact) {
          setStatus(source === "webhid" ? "DualSense touchpad" : "Controller touch", "#c9a7ff");
        }
        return true;
      }

      function processControllerTouches(source, touches) {
        if (controllerTouchState.active && controllerTouchState.source === source) {
          const current = touches.find((touch) => touch.active && touch.touchId === controllerTouchState.touchId);
          if (!current) {
            resetControllerTouch(true, source);
            return false;
          }
          return updateControllerTouch(source, current.touchId, current.x, current.y);
        }

        if (controllerTouchState.active) return false;
        const first = touches.find((touch) => touch.active);
        if (!first) return false;
        return updateControllerTouch(source, first.touchId, first.x, first.y);
      }

      function gamepadButtonPressed(button) {
        return !!button && (button.pressed || button.value > 0.5);
      }

      function getConnectedGamepads() {
        if (!navigator.getGamepads) return [];
        try {
          return Array.from(navigator.getGamepads()).filter(Boolean);
        } catch (error) {
          return [];
        }
      }

      function deviceHapticsAvailable() {
        return typeof navigator.vibrate === "function";
      }

      function isDualSenseGamepad(gamepad) {
        if (!gamepad) return false;
        const id = String(gamepad.id || "");
        return /dualsense/i.test(id) || (/054c/i.test(id) && /0ce6/i.test(id));
      }

      function gamepadHapticEffects(gamepad) {
        const actuator = gamepad && gamepad.vibrationActuator;
        if (!actuator) return [];
        try {
          if (actuator.effects) return Array.from(actuator.effects);
          if (
            typeof actuator.canPlayEffectType === "function" &&
            actuator.canPlayEffectType("dual-rumble")
          ) {
            return ["dual-rumble"];
          }
        } catch (error) {}
        return typeof actuator.playEffect === "function" ? ["dual-rumble"] : [];
      }

      function gamepadHapticActuator(gamepad) {
        const actuator = gamepad && gamepad.vibrationActuator;
        if (!actuator || typeof actuator.playEffect !== "function") return null;
        return gamepadHapticEffects(gamepad).includes("dual-rumble") ? actuator : null;
      }

      function gamepadHapticsAvailable() {
        return getConnectedGamepads().some((gamepad) => !!gamepadHapticActuator(gamepad));
      }

      function enhancedDualSenseReady() {
        return !!(
          dualSenseDevice &&
          dualSenseDevice.opened &&
          dualSenseConnectionType === "usb"
        );
      }

      function updateDualSenseButton(gamepad = selectGamepad()) {
        const connected = enhancedDualSenseReady();
        const available = controllerCapabilities.webHid && (connected || isDualSenseGamepad(gamepad));
        dualSenseBtn.hidden = !available;
        dualSenseBtn.setAttribute("aria-pressed", String(connected));
        dualSenseBtn.setAttribute(
          "aria-label",
          connected ? "Test DualSense haptics" : "Enable DualSense touchpad"
        );
        dualSenseBtn.title = connected ? "Test DualSense haptics" : "Enable DualSense touchpad";
        dualSenseIcon.style.filter = connected ? "drop-shadow(0 0 6px rgba(201, 167, 255, 0.9))" : "";
      }

      function updateControllerCapabilities(gamepad = selectGamepad()) {
        controllerCapabilities = {
          standardGamepad: !!gamepad,
          supportedHapticEffects: gamepadHapticEffects(gamepad),
          gamepadTouch: !!(gamepad && "touches" in gamepad),
          webHid: "hid" in navigator,
          enhancedDualSense: enhancedDualSenseReady()
        };
        updateDualSenseButton(gamepad);
      }

      function updateHapticsAvailability() {
        hapticsBtn.hidden = !(
          deviceHapticsAvailable() ||
          gamepadHapticsAvailable() ||
          enhancedDualSenseReady()
        );
        updateHapticsIcon();
      }

      let hapticSequence = 0;

      function hapticDelay(duration) {
        return new Promise((resolve) => window.setTimeout(resolve, duration));
      }

      function hapticStillAllowed(sequence) {
        return sequence === hapticSequence && hapticsEnabled && !paused && !document.hidden;
      }

      function hapticPatternForDevice(pattern) {
        const vibration = [];
        pattern.forEach((segment, index) => {
          vibration.push(segment.duration);
          if (segment.gap > 0 && index < pattern.length - 1) vibration.push(segment.gap);
        });
        return vibration.length === 1 ? vibration[0] : vibration;
      }

      async function sendDualSenseUsbRumble(strongMagnitude, weakMagnitude) {
        if (!enhancedDualSenseReady()) return false;
        const report = new Uint8Array(DUALSENSE_USB_OUTPUT_REPORT_SIZE);
        // Select the classic dual-motor compatibility mode. Both original and
        // current DualSense firmware support it, and it gives us independent
        // strong/weak actuators without taking over the controller audio path.
        report[0] = DUALSENSE_OUTPUT_FLAG0_HAPTICS_SELECT |
          DUALSENSE_OUTPUT_FLAG0_COMPATIBLE_VIBRATION;
        report[2] = Math.round(clamp(weakMagnitude, 0, 1) * 0xff);
        report[3] = Math.round(clamp(strongMagnitude, 0, 1) * 0xff);
        await dualSenseDevice.sendReport(DUALSENSE_USB_OUTPUT_REPORT_ID, report);
        return true;
      }

      function stopHaptics() {
        hapticSequence += 1;

        if (deviceHapticsAvailable()) {
          try {
            navigator.vibrate(0);
          } catch (error) {
            // Haptics are always optional.
          }
        }

        getConnectedGamepads().forEach((gamepad) => {
          const actuator = gamepadHapticActuator(gamepad);
          if (!actuator || typeof actuator.reset !== "function") return;
          try {
            const resetAttempt = actuator.reset();
            if (resetAttempt && typeof resetAttempt.catch === "function") {
              resetAttempt.catch(() => {});
            }
          } catch (error) {
            // Haptics are always optional.
          }
        });

        if (enhancedDualSenseReady()) {
          sendDualSenseUsbRumble(0, 0).catch(() => {});
        }
      }

      function playGamepadHaptic(actuator, pattern, sequence) {
        (async () => {
          if (typeof actuator.reset === "function") await actuator.reset().catch(() => {});
          for (const segment of pattern) {
            if (!hapticStillAllowed(sequence)) return;
            await actuator.playEffect("dual-rumble", {
              startDelay: 0,
              duration: segment.duration,
              strongMagnitude: segment.strongMagnitude,
              weakMagnitude: segment.weakMagnitude
            });
            if (segment.gap > 0) await hapticDelay(segment.gap);
          }
        })().catch(() => {});
        return true;
      }

      function playWebHidHaptic(pattern, sequence, announceFailure = false) {
        (async () => {
          for (const segment of pattern) {
            if (!hapticStillAllowed(sequence)) return;
            await sendDualSenseUsbRumble(segment.strongMagnitude, segment.weakMagnitude);
            await hapticDelay(segment.duration);
            if (sequence !== hapticSequence) return;
            await sendDualSenseUsbRumble(0, 0);
            if (segment.gap > 0) await hapticDelay(segment.gap);
          }
          if (sequence === hapticSequence && enhancedDualSenseReady()) {
            await sendDualSenseUsbRumble(0, 0);
          }
        })().catch((error) => {
          console.warn("DualSense WebHID rumble failed", error);
          if (announceFailure && sequence === hapticSequence) {
            setStatus("DualSense rumble output failed", "#ffcf5a");
          }
        });
        return true;
      }

      function playHaptic(event) {
        const pattern = HAPTIC_PATTERNS[event];
        if (!pattern || !hapticsEnabled || paused || document.hidden) return false;

        const sequence = ++hapticSequence;

        // Once the USB DualSense has been authorized, use its deterministic
        // WebHID output path. Chrome can expose a Gamepad actuator that accepts
        // effects without producing physical feedback on this controller.
        if (enhancedDualSenseReady()) {
          return playWebHidHaptic(pattern, sequence, event === "confirmation");
        }

        const actuator = gamepadHapticActuator(selectGamepad());
        if (actuator) {
          return playGamepadHaptic(actuator, pattern, sequence);
        }

        if (!deviceHapticsAvailable()) return false;

        try {
          return navigator.vibrate(hapticPatternForDevice(pattern));
        } catch (error) {
          return false;
        }
      }

      function selectGamepad() {
        const gamepads = getConnectedGamepads();
        if (!gamepads.length) return null;

        if (gamepadIndex !== null) {
          const current = gamepads.find((gamepad) => gamepad.index === gamepadIndex);
          if (current) return current;
        }

        const preferred = gamepads.find((gamepad) =>
          gamepad.mapping === "standard" || /xbox/i.test(gamepad.id)
        ) || gamepads[0];

        if (preferred && gamepadIndex !== preferred.index) {
          gamepadIndex = preferred.index;
          gamepadButtonStates = [];
        }

        return preferred || null;
      }

      function gamepadAxisControl(gamepad) {
        const axes = gamepad.axes || [];
        const candidates = [
          { x: axes[0] || 0, y: axes[1] || 0 },
          { x: axes[2] || 0, y: axes[3] || 0 }
        ];
        let best = candidates[0];
        let distance = Math.hypot(best.x, best.y);

        for (let i = 1; i < candidates.length; i += 1) {
          const candidateDistance = Math.hypot(candidates[i].x, candidates[i].y);
          if (candidateDistance > distance) {
            best = candidates[i];
            distance = candidateDistance;
          }
        }

        if (distance <= GAMEPAD_DEADZONE) return null;

        const power = clamp((Math.min(1, distance) - GAMEPAD_DEADZONE) / (1 - GAMEPAD_DEADZONE), 0, 1);
        return {
          vector: {
            x: best.x / distance,
            y: best.y / distance
          },
          power
        };
      }

      function gamepadDpadControl(buttons) {
        const x =
          (gamepadButtonPressed(buttons[GAMEPAD_BUTTON_DPAD_RIGHT]) ? 1 : 0) -
          (gamepadButtonPressed(buttons[GAMEPAD_BUTTON_DPAD_LEFT]) ? 1 : 0);
        const y =
          (gamepadButtonPressed(buttons[GAMEPAD_BUTTON_DPAD_DOWN]) ? 1 : 0) -
          (gamepadButtonPressed(buttons[GAMEPAD_BUTTON_DPAD_UP]) ? 1 : 0);
        const distance = Math.hypot(x, y);

        if (!distance) return null;

        return {
          vector: {
            x: x / distance,
            y: y / distance
          },
          power: 1
        };
      }

      function activateGamepadButton() {
        lastControlSource = "gamepad";
        if (gameState === "over") {
          reset();
        }
        startPlaying();
        setStatus("Controller", "#8bd3ff");
      }

      function handleGamepadButtons(gamepad) {
        const buttons = gamepad.buttons || [];
        const pressed = buttons.map(gamepadButtonPressed);
        const wasPressed = (index) => !!gamepadButtonStates[index];
        const justPressed = (index) => !!pressed[index] && !wasPressed(index);

        if (justPressed(GAMEPAD_BUTTON_A)) {
          activateGamepadButton();
        }

        if (justPressed(GAMEPAD_BUTTON_SQUARE)) {
          lastControlSource = "gamepad";
          reset();
          setStatus("Restarted", "#8bd3ff");
        }

        if (justPressed(GAMEPAD_BUTTON_TRIANGLE)) {
          lastControlSource = "gamepad";
          toggleHaptics();
        }

        if (justPressed(GAMEPAD_BUTTON_MENU)) {
          lastControlSource = "gamepad";
          if (gameState === "ready") {
            activateGamepadButton();
          } else {
            togglePause();
          }
        }

        gamepadButtonStates = pressed;
      }

      function pollStandardGamepadTouches(gamepad) {
        if (enhancedDualSenseReady()) return controllerTouchState.active;
        const touches = gamepad && gamepad.touches ? Array.from(gamepad.touches) : [];
        if (!touches.length) {
          resetControllerTouch(true, "gamepad-touch");
          return false;
        }
        const normalized = touches.map((touch, index) => ({
          active: true,
          touchId: touch.touchId ?? index,
          x: clamp(((touch.position && touch.position.x) || 0) * 0.5 + 0.5, 0, 1),
          y: clamp(((touch.position && touch.position.y) || 0) * 0.5 + 0.5, 0, 1)
        }));
        return processControllerTouches("gamepad-touch", normalized);
      }

      function pollGamepad() {
        const gamepad = selectGamepad();
        if (!gamepad) {
          resetGamepadControl(true);
          resetControllerTouch(true, "gamepad-touch");
          updateControllerCapabilities(null);
          return;
        }

        updateControllerCapabilities(gamepad);
        handleGamepadButtons(gamepad);
        pollStandardGamepadTouches(gamepad);

        if (paused || joystickActive) {
          resetGamepadControl();
          return;
        }

        if (controllerTouchState.active) {
          resetGamepadControl();
          return;
        }

        const buttons = gamepad.buttons || [];
        const control = gamepadDpadControl(buttons) || gamepadAxisControl(gamepad);

        if (!control || control.power <= 0) {
          resetGamepadControl(true);
          return;
        }

        if (gameState === "over") {
          const wasActive = gamepadActive;
          if (wasActive) return;
          reset();
        }

        const wasActive = gamepadActive;
        gamepadActive = true;
        lastControlSource = "gamepad";
        gamepadVector = control.vector;
        gamepadPower = Math.pow(control.power, GAMEPAD_RESPONSE_EXPONENT);

        cancelCanvasDrag();
        startPlaying();
        heading = gamepadVector;
        target = { ...snake[0] };

        if (!wasActive) {
          setStatus("Controller", "#8bd3ff");
        }
      }

      function handleGamepadConnected(event) {
        gamepadIndex = event.gamepad.index;
        gamepadButtonStates = [];
        updateControllerCapabilities(event.gamepad);
        updateHapticsAvailability();
        if (gameState === "ready") {
          setStatus("Controller ready", "#8bd3ff");
        }
      }

      function handleGamepadDisconnected(event) {
        if (gamepadIndex !== event.gamepad.index) return;
        stopHaptics();
        gamepadIndex = null;
        gamepadButtonStates = [];
        resetGamepadControl(true);
        resetControllerTouch(true, "gamepad-touch");
        updateControllerCapabilities(null);
        updateHapticsAvailability();
        if (gameState === "ready") {
          setStatus("Ready", "#31d0aa");
        }
      }

      function detectDualSenseConnectionType(device) {
        for (const collection of device.collections || []) {
          if (collection.usagePage !== 0x01 || collection.usage !== 0x05) continue;
          const maxInputBits = (collection.inputReports || []).reduce((maximum, report) => {
            const bits = (report.items || []).reduce(
              (total, item) => total + item.reportSize * item.reportCount,
              0
            );
            return Math.max(maximum, bits);
          }, 0);
          if (maxInputBits === 504) return "usb";
          if (maxInputBits === 616) return "bluetooth";
        }
        return "unknown";
      }

      function isDualSenseHidDevice(device) {
        return !!(
          device &&
          device.vendorId === SONY_VENDOR_ID &&
          device.productId === DUALSENSE_PRODUCT_ID
        );
      }

      function parseDualSenseTouch(data, offset) {
        const contact = data.getUint8(offset);
        const xLow = data.getUint8(offset + 1);
        const xyHigh = data.getUint8(offset + 2);
        const yHigh = data.getUint8(offset + 3);
        return {
          active: !(contact & 0x80),
          touchId: contact & 0x7f,
          x: clamp((((xyHigh & 0x0f) << 8) | xLow) / (DUALSENSE_TOUCH_WIDTH - 1), 0, 1),
          y: clamp(((yHigh << 4) | ((xyHigh & 0xf0) >> 4)) / (DUALSENSE_TOUCH_HEIGHT - 1), 0, 1)
        };
      }

      function handleDualSenseInputReport(event) {
        if (
          event.device !== dualSenseDevice ||
          event.reportId !== DUALSENSE_USB_INPUT_REPORT_ID ||
          event.data.byteLength !== DUALSENSE_USB_INPUT_REPORT_SIZE
        ) {
          return;
        }

        const mutePressed = !!(event.data.getUint8(9) & 0x04);
        if (mutePressed && !dualSenseMutePressed) {
          lastControlSource = "gamepad";
          toggleMute();
        }
        dualSenseMutePressed = mutePressed;

        processControllerTouches("webhid", [
          parseDualSenseTouch(event.data, 32),
          parseDualSenseTouch(event.data, 36)
        ]);
      }

      async function attachDualSenseDevice(device, announce = true) {
        if (!isDualSenseHidDevice(device)) return false;
        if (!device.opened) await device.open();

        const connectionType = detectDualSenseConnectionType(device);
        if (connectionType !== "usb") {
          if (device.opened) await device.close().catch(() => {});
          if (announce) setStatus("Use USB for DualSense touchpad", "#ffcf5a");
          return false;
        }

        if (dualSenseDevice && dualSenseDevice !== device) {
          dualSenseDevice.oninputreport = null;
        }
        dualSenseDevice = device;
        dualSenseConnectionType = connectionType;
        dualSenseMutePressed = false;
        dualSenseDevice.oninputreport = handleDualSenseInputReport;
        updateControllerCapabilities(selectGamepad());
        updateHapticsAvailability();

        if (announce) {
          lastControlSource = "gamepad";
          setStatus("DualSense touchpad ready", "#c9a7ff");
          playHaptic("confirmation");
        }
        return true;
      }

      async function requestDualSenseDevice() {
        if (!("hid" in navigator)) return;
        try {
          const devices = await navigator.hid.requestDevice({
            filters: [{ vendorId: SONY_VENDOR_ID, productId: DUALSENSE_PRODUCT_ID }]
          });
          if (!devices.length) {
            setStatus("DualSense permission not granted", "#ffcf5a");
            return;
          }
          await attachDualSenseDevice(devices[0], true);
        } catch (error) {
          const copy = error && error.name === "NotFoundError"
            ? "DualSense permission not granted"
            : "DualSense connection failed";
          setStatus(copy, "#ffcf5a");
        }
      }

      function requestOrTestDualSenseDevice() {
        if (!enhancedDualSenseReady()) {
          requestDualSenseDevice();
          return;
        }
        if (!hapticsEnabled) {
          setStatus("Turn haptics on to test rumble", "#ffcf5a");
          return;
        }
        stopHaptics();
        setStatus("Testing DualSense rumble", "#c9a7ff");
        playHaptic("confirmation");
      }

      async function restoreDualSenseDevice() {
        if (!("hid" in navigator)) return;
        try {
          const devices = await navigator.hid.getDevices();
          const device = devices.find(isDualSenseHidDevice);
          if (device) await attachDualSenseDevice(device, false);
        } catch (error) {
          // Enhanced controller support is optional.
        }
      }

      function handleHidConnect(event) {
        if (!isDualSenseHidDevice(event.device) || dualSenseDevice) return;
        attachDualSenseDevice(event.device, false).catch(() => {});
      }

      function handleHidDisconnect(event) {
        if (event.device !== dualSenseDevice) return;
        stopHaptics();
        dualSenseDevice.oninputreport = null;
        dualSenseDevice = null;
        dualSenseConnectionType = null;
        dualSenseMutePressed = false;
        resetControllerTouch(true, "webhid");
        updateControllerCapabilities(selectGamepad());
        updateHapticsAvailability();
        if (gameState === "ready") setStatus("Controller ready", "#8bd3ff");
      }

      function cancelCanvasDrag() {
        dragging = false;
        activePointerId = null;
        dragOffset = { x: 0, y: 0 };
        canvas.classList.remove("dragging");
      }

      function setJoystickFromEvent(event) {
        const rect = joystick.getBoundingClientRect();
        const centerX = rect.left + rect.width * 0.5;
        const centerY = rect.top + rect.height * 0.5;
        const maxDistance = Math.max(1, Math.min(rect.width, rect.height) * 0.36);
        const rawX = event.clientX - centerX;
        const rawY = event.clientY - centerY;
        const distance = Math.hypot(rawX, rawY);
        const limitedDistance = Math.min(distance, maxDistance);
        const rawPower = limitedDistance / maxDistance;
        const direction = distance > 0.001
          ? { x: rawX / distance, y: rawY / distance }
          : { ...heading };
        const power = rawPower <= JOYSTICK_DEADZONE
          ? 0
          : (rawPower - JOYSTICK_DEADZONE) / (1 - JOYSTICK_DEADZONE);

        joystickPower = Math.pow(power, JOYSTICK_RESPONSE_EXPONENT);
        joystickVector = power > 0 ? direction : { x: 0, y: 0 };
        joystick.style.setProperty("--joy-power", joystickPower.toFixed(2));
        joystick.style.setProperty("--joy-glow-alpha", (joystickPower * 0.24).toFixed(3));
        joystick.style.setProperty("--joy-ring-alpha", (0.08 + joystickPower * 0.18).toFixed(3));

        if (power > 0) {
          heading = direction;
          target = { ...snake[0] };
        }

        const thumbX = direction.x * limitedDistance;
        const thumbY = direction.y * limitedDistance;
        joystickThumb.style.transform = `translate(${thumbX}px, ${thumbY}px)`;
      }

      function startJoystick(event) {
        if (!isMobileLayout()) return;
        if (event.button !== undefined && event.button !== 0) return;
        event.preventDefault();
        event.stopPropagation?.();

        if (gameState === "over") {
          reset();
        }

        cancelCanvasDrag();
        lastControlSource = "device";
        joystickActive = true;
        joystickPointerId = event.pointerId;
        joystick.classList.add("active");

        if (joystick.setPointerCapture && event.pointerId !== undefined) {
          joystick.setPointerCapture(event.pointerId);
        }

        startPlaying();
        setJoystickFromEvent(event);
        setStatus("Joystick", "#8bd3ff");
      }

      function moveJoystick(event) {
        if (!joystickActive || event.pointerId !== joystickPointerId) return;
        event.preventDefault();
        event.stopPropagation?.();
        setJoystickFromEvent(event);
      }

      function endJoystick(event) {
        if (!joystickActive || event.pointerId !== joystickPointerId) return;
        event.preventDefault();
        event.stopPropagation?.();

        if (
          event.pointerId !== undefined &&
          joystick.hasPointerCapture &&
          joystick.hasPointerCapture(event.pointerId)
        ) {
          joystick.releasePointerCapture(event.pointerId);
        }

        resetJoystick();
        if (gameState === "playing" && !paused) {
          setStatus("Coasting", "#8bd3ff");
        }
      }

      function placeFood() {
        let candidate;
        let attempts = 0;
        const radius = foodRadius();
        do {
          candidate = {
            x: rnd(radius + 24, ARENA.width - radius - 24),
            y: rnd(radius + 24, ARENA.height - radius - 24)
          };
          attempts += 1;
        } while (attempts < 300 && snake.some((part) => dist(candidate, part) < foodBodyClearance()));
        food = candidate;
        foodVelocity = unitFromAngle(rnd(0, Math.PI * 2));
      }

      function placeBonusFood() {
        if (isInvincibleMode()) return false;

        let candidate;
        let attempts = 0;
        const radius = bonusRadius();
        do {
          candidate = {
            x: rnd(radius + 34, ARENA.width - radius - 34),
            y: rnd(radius + 34, ARENA.height - radius - 34)
          };
          attempts += 1;
        } while (
          attempts < 300 &&
          (snake.some((part) => dist(candidate, part) < bonusBodyClearance()) || dist(candidate, food) < bonusFoodClearance())
        );

        bonusFood = candidate;
        bonusVelocity = unitFromAngle(rnd(0, Math.PI * 2));
        bonusAngle = Math.atan2(bonusVelocity.y, bonusVelocity.x);
        setStatus("Magic fish", "#c9a7ff");
        return true;
      }

      function clearBonusFood() {
        bonusFood = null;
        bonusBiteCountdown = nextBonusCountdown();
      }

      function maybePlaceBonusFood() {
        return !bonusFood && bonusBiteCountdown <= 0 && placeBonusFood();
      }

      function currentFoodTheme() {
        return FOOD_THEMES[foodLevel % FOOD_THEMES.length];
      }

      function currentFoodValue() {
        return foodLevel + 1;
      }

      function currentFoodQuota() {
        return currentFoodValue() * 3;
      }

      function resetCombo() {
        comboCount = 0;
        comboMultiplier = 1;
        comboExpiresAt = 0;
      }

      function updateCombo() {
        const now = performance.now();
        if (comboCount > 0 && now <= comboExpiresAt) {
          comboCount += 1;
        } else {
          comboCount = 1;
        }

        comboMultiplier = Math.min(
          COMBO_MAX_MULTIPLIER,
          1 + Math.floor(comboCount / COMBO_BITE_STEP)
        );
        comboExpiresAt = now + COMBO_WINDOW_MS;

        return {
          count: comboCount,
          multiplier: comboMultiplier
        };
      }

      function comboStatus(combo, points) {
        if (combo.count <= 1) return `+${points}`;
        return `Combo ${combo.count} x${combo.multiplier}`;
      }

      function neutralStatus() {
        if (isInvincibilityWarningActive()) return { copy: `Invincible ending ${invincibilityWarningRemaining().toFixed(1)}`, color: "#ffd166" };
        if (isInvincibleMode()) return { copy: `Invincible ${remainingInvincibleBites()}`, color: "#c9a7ff" };
        if (bonusFood) return { copy: "Magic fish", color: "#c9a7ff" };
        if (gameState === "ready") return { copy: "Ready", color: "#31d0aa" };
        if (joystickActive) return { copy: "Joystick", color: "#8bd3ff" };
        if (gamepadActive) return { copy: "Controller", color: "#8bd3ff" };
        if (dragging) return { copy: "Hunting", color: "#31d0aa" };
        return { copy: "Coasting", color: "#8bd3ff" };
      }

      function expireComboIfNeeded() {
        if (comboCount <= 0 || performance.now() <= comboExpiresAt) return;
        resetCombo();
        if (gameState !== "playing" || paused) return;
        const status = neutralStatus();
        setStatus(status.copy, status.color);
      }

      function currentFoodSpeed() {
        return FOOD_STEP * (1 + foodLevel * FOOD_SPEED_PER_COLOR);
      }

      function snakeSpeedScale() {
        return Math.min(SNAKE_SPEED_SCALE_MAX, 1 + foodLevel * SNAKE_SPEED_PER_COLOR);
      }

      function createOcean() {
        const count = Math.round(OCEAN_PARTICLE_COUNT * (isMobileLayout() ? OCEAN_PARTICLE_MOBILE_SCALE : 1));
        oceanParticles = Array.from({ length: count }, (_, index) => {
          const seed = index + 1;
          const bubble = index % 5 === 0;
          const plankton = !bubble && seed % 19 === 7;
          return {
            x: (seed * 197) % ARENA.width,
            y: (seed * 311) % ARENA.height,
            r: bubble ? 1.6 + (seed % 5) * 0.55 : plankton ? 1.9 + (seed % 3) * 0.4 : 0.7 + (seed % 7) * 0.18,
            depth: 0.35 + ((seed * 37) % 100) / 100 * 0.8,
            sway: (seed * 0.83) % (Math.PI * 2),
            bubble,
            plankton
          };
        });
      }

      function updateOceanFlow(snap = false) {
        const angle = -0.18 + foodLevel * 0.34;
        const speed = OCEAN_BASE_SPEED * (1 + foodLevel * 0.18);
        targetOceanFlow = {
          x: Math.cos(angle) * speed,
          y: 7 + Math.sin(angle) * speed * 0.28
        };
        targetOceanLight = {
          x: ARENA.width * (0.28 + ((foodLevel * 0.17) % 0.42)),
          lean: Math.sin(angle) * 0.24
        };
        if (snap || !oceanFlow || !oceanLight) {
          oceanFlow = { ...targetOceanFlow };
          oceanLight = { ...targetOceanLight };
        }
        targetArenaPalette = ARENA_PALETTES[foodLevel % ARENA_PALETTES.length];
        if (snap || !arenaPalette) {
          arenaPalette = cloneArenaPalette(targetArenaPalette);
          arenaPaletteDirty = true;
        }
      }

      function easeArenaPalette(dt) {
        if (!arenaPalette || !targetArenaPalette) return;
        const amount = 1 - Math.pow(ARENA_PALETTE_EASE, dt);
        let maxDelta = 0;
        for (const key of ["top", "mid", "deep", "glow", "accent"]) {
          const current = arenaPalette[key];
          const targetColor = targetArenaPalette[key];
          for (const channel of ["r", "g", "b"]) {
            maxDelta = Math.max(maxDelta, Math.abs(targetColor[channel] - current[channel]));
            current[channel] = lerp(current[channel], targetColor[channel], amount);
          }
        }
        if (maxDelta > 0.35) {
          arenaPaletteDirty = true;
        }
      }

      function easeOcean(dt) {
        if (!targetOceanFlow || !targetOceanLight) return;
        easeArenaPalette(dt);
        const amount = 1 - Math.pow(0.002, dt);
        oceanFlow.x = lerp(oceanFlow.x, targetOceanFlow.x, amount);
        oceanFlow.y = lerp(oceanFlow.y, targetOceanFlow.y, amount);
        oceanLight.x = lerp(oceanLight.x, targetOceanLight.x, amount);
        oceanLight.lean = lerp(oceanLight.lean, targetOceanLight.lean, amount);
        if (cameraFlow && targetCameraFlow) {
          const cameraAmount = 1 - Math.pow(0.00008, dt);
          cameraFlow.x = lerp(cameraFlow.x, targetCameraFlow.x, cameraAmount);
          cameraFlow.y = lerp(cameraFlow.y, targetCameraFlow.y, cameraAmount);
          targetCameraFlow.x = lerp(targetCameraFlow.x, 0, cameraAmount * 0.28);
          targetCameraFlow.y = lerp(targetCameraFlow.y, 0, cameraAmount * 0.28);
        }
      }

      function moveOcean(dt) {
        if (!oceanParticles || !oceanFlow || !oceanLight) return;
        easeOcean(dt);
        const cameraX = cameraFlow ? cameraFlow.x : 0;
        const cameraY = cameraFlow ? cameraFlow.y : 0;
        oceanParticles.forEach((particle) => {
          if (particle.bubble) {
            particle.x += Math.sin(pulse * 1.8 + particle.sway) * particle.depth * 11 * dt + (oceanFlow.x * 0.1 + cameraX * (0.95 + particle.depth * 0.35)) * dt;
            particle.y += (-10 - particle.depth * 9 + cameraY * (0.95 + particle.depth * 0.35)) * dt;
          } else {
            particle.x += (oceanFlow.x * particle.depth + cameraX * particle.depth + Math.sin(pulse + particle.sway) * 4) * dt;
            particle.y += (oceanFlow.y * particle.depth + cameraY * particle.depth) * dt;
          }

          if (particle.x < -12) particle.x += ARENA.width + 24;
          if (particle.x > ARENA.width + 12) particle.x -= ARENA.width + 24;
          if (particle.y < -14) particle.y += ARENA.height + 28;
          if (particle.y > ARENA.height + 14) particle.y -= ARENA.height + 28;
        });
        updateBgFish(dt);
      }

      function spawnFishSchool() {
        const mobileScale = isMobileLayout() ? 0.7 : 1;
        const count = Math.floor(rnd(BG_FISH_SCHOOL_MIN, BG_FISH_SCHOOL_MAX + 1));
        const dir = Math.random() < 0.5 ? -1 : 1;
        const fish = [];
        let span = 0;
        for (let i = 0; i < count; i += 1) {
          span += i === 0 ? 0 : rnd(14, 26) * mobileScale;
          fish.push({
            dx: -span,
            dy: rnd(-18, 18) * mobileScale,
            phase: rnd(0, Math.PI * 2),
            size: rnd(5, 9) * mobileScale
          });
        }
        bgFish.push({
          x: dir > 0 ? -span - 30 : ARENA.width + span + 30,
          y: ARENA.height * rnd(0.3, 0.62),
          dir,
          speed: rnd(BG_FISH_SPEED_MIN, BG_FISH_SPEED_MAX) * mobileScale,
          span,
          fish
        });
        nextFishSchoolAt = pulse + rnd(BG_FISH_INTERVAL_MIN, BG_FISH_INTERVAL_MAX);
      }

      function updateBgFish(dt) {
        if (!bgFish) return;
        if (pulse >= nextFishSchoolAt && bgFish.length < BG_FISH_MAX_SCHOOLS) {
          spawnFishSchool();
        }
        for (let i = bgFish.length - 1; i >= 0; i -= 1) {
          const school = bgFish[i];
          school.x += school.dir * school.speed * dt;
          const trailing = school.x - school.span * school.dir;
          if ((school.dir > 0 && trailing > ARENA.width + 40) || (school.dir < 0 && trailing < -40)) {
            bgFish.splice(i, 1);
          }
        }
      }

      function spawnBiteBurst(point, theme, magic = false) {
        if (!biteParticles || !point) return;

        const scale = snakeScale();
        const count = Math.round((magic ? BITE_BURST_PARTICLES + 8 : BITE_BURST_PARTICLES) * (isMobileLayout() ? 0.72 : 1));
        const originJitter = (magic ? bonusRadius() : foodRadius()) * 0.72;

        for (let i = 0; i < count; i += 1) {
          const angle = rnd(0, Math.PI * 2);
          const speed = rnd(magic ? 95 : 60, magic ? 210 : 155) * scale;
          const radius = rnd(magic ? 2.2 : 1.6, magic ? 6.2 : 4.8) * scale;
          const color = i % 3 === 0 ? theme.accent : theme.main;
          const bubble = i % 2 === 0;
          biteParticles.push({
            x: point.x + Math.cos(angle) * rnd(0, originJitter),
            y: point.y + Math.sin(angle) * rnd(0, originJitter * 0.72),
            vx: Math.cos(angle) * speed + rnd(-18, 18) * scale,
            vy: Math.sin(angle) * speed * 0.72 - rnd(20, 78) * scale,
            r: radius,
            maxR: radius * rnd(1.35, magic ? 2.2 : 1.8),
            age: 0,
            life: BITE_BURST_LIFE * rnd(0.78, magic ? 1.38 : 1.18),
            color,
            glow: theme.glow,
            bubble,
            wobble: rnd(0, Math.PI * 2)
          });
        }

        if (biteParticles.length > 180) {
          biteParticles.splice(0, biteParticles.length - 180);
        }
      }

      function updateBiteParticles(dt) {
        if (!biteParticles || !biteParticles.length) return;

        for (let i = biteParticles.length - 1; i >= 0; i -= 1) {
          const particle = biteParticles[i];
          particle.age += dt;
          if (particle.age >= particle.life) {
            biteParticles.splice(i, 1);
            continue;
          }

          particle.vx *= 1 - Math.min(0.92, dt * 1.8);
          particle.vy = particle.vy * (1 - Math.min(0.9, dt * 1.25)) - 16 * snakeScale() * dt;
          particle.x += particle.vx * dt + Math.sin(pulse * 8 + particle.wobble) * 8 * dt;
          particle.y += particle.vy * dt;
        }
      }

      function headAngle() {
        const head = snake[0];
        const next = snake[1] || { x: head.x - 1, y: head.y };
        return Math.atan2(head.y - next.y, head.x - next.x);
      }

      function updateHeadFx(dt) {
        if (!snake || !snake.length) return;

        if (pulse >= nextBlinkAt) {
          blinkStartedAt = pulse;
          nextBlinkAt = pulse + BLINK_DURATION + rnd(2.5, 5.5);
        }

        if (gameState !== "over" && pulse >= nextTongueAt) {
          tongueStartedAt = pulse;
          nextTongueAt = pulse + TONGUE_FLICK_DURATION + rnd(2, 4);
        }

        for (let i = swallowBulges.length - 1; i >= 0; i -= 1) {
          const bulge = swallowBulges[i];
          bulge.pos += BULGE_SPEED_SEGMENTS * dt;
          while (bulge.growth > 0 && bulge.pos >= snake.length - 1) {
            extendTail();
            bulge.growth -= 1;
          }
          if (bulge.pos > snake.length + BULGE_WIDTH_SEGMENTS) {
            swallowBulges.splice(i, 1);
          }
        }

        if (deathAt >= 0 && pulse - deathAt < DEATH_BUBBLE_WINDOW) {
          deathBubbleTimer += dt;
          const scale = snakeScale();
          const mouthAngle = headAngle();
          const mouthX = snake[0].x + Math.cos(mouthAngle) * headRadius() * 1.1;
          const mouthY = snake[0].y + Math.sin(mouthAngle) * headRadius() * 1.1;
          while (deathBubbleTimer >= DEATH_BUBBLE_INTERVAL) {
            deathBubbleTimer -= DEATH_BUBBLE_INTERVAL;
            const radius = rnd(1.6, 3.6) * scale;
            biteParticles.push({
              x: mouthX + rnd(-3, 3) * scale,
              y: mouthY + rnd(-3, 3) * scale,
              vx: rnd(-14, 14) * scale,
              vy: -rnd(30, 70) * scale,
              r: radius,
              maxR: radius * rnd(1.4, 2),
              age: 0,
              life: rnd(0.9, 1.4),
              color: "#dff4ff",
              glow: "rgba(226, 251, 255, 0.6)",
              bubble: true,
              wobble: rnd(0, Math.PI * 2)
            });
          }
        }
      }

      function spawnScorePopup(point, points, multiplier, theme) {
        if (!scorePopups || !point) return;

        const margin = 40 * snakeScale() + 12;
        scorePopups.push({
          x: clamp(point.x, margin, Math.max(margin, ARENA.width - margin)),
          y: clamp(point.y - foodRadius() * 1.6, 26, Math.max(26, ARENA.height - 14)),
          text: multiplier > 1 ? `+${points} x${multiplier}` : `+${points}`,
          color: theme.main,
          glow: theme.glow,
          age: 0,
          life: SCORE_POPUP_LIFE
        });

        if (scorePopups.length > SCORE_POPUP_LIMIT) {
          scorePopups.splice(0, scorePopups.length - SCORE_POPUP_LIMIT);
        }
      }

      function updateScorePopups(dt) {
        if (!scorePopups || !scorePopups.length) return;

        for (let i = scorePopups.length - 1; i >= 0; i -= 1) {
          const popup = scorePopups[i];
          popup.age += dt;
          if (popup.age >= popup.life) {
            scorePopups.splice(i, 1);
            continue;
          }
          popup.y -= (34 + 20 * (1 - popup.age / popup.life)) * snakeScale() * dt;
        }
      }

      function startDrag(event) {
        if (joystickActive || controllerTouchState.active) return;
        if (event.button !== undefined && event.button !== 0) return;
        event.preventDefault();
        lastControlSource = "device";
        const point = getCanvasPoint(event);
        const touchControl = isTouchControl(event);

        if (gameState === "over") {
          reset();
        }

        if (touchControl || isOnHead(point, event)) {
          beginDrag(event, point, touchControl);
          return;
        }

        if (!isOnHead(point, event)) {
          steerToward(point);
          return;
        }
      }

      function beginDrag(event, point, touchControl = false) {
        if (event.pointerId !== undefined && canvas.setPointerCapture) {
          canvas.setPointerCapture(event.pointerId);
          activePointerId = event.pointerId;
        }

        dragging = true;
        canvas.classList.add("dragging");
        dragOffset = touchControl
          ? { x: snake[0].x - point.x, y: snake[0].y - point.y }
          : { x: 0, y: 0 };
        target = touchControl ? { ...snake[0] } : clampArenaPoint(point);
        startPlaying();
        setStatus(touchControl ? "Finger control" : "Hunting", "#31d0aa");
      }

      function startPlaying() {
        unlockSfxAudio();

        if (paused) {
          setPaused(false);
        }

        if (gameState === "ready") {
          gameState = "playing";
          setOverlay(null);
          beep(360, 0.04, "triangle", 0.045);
        }
        startMusic();
      }

      function steerToward(point) {
        const head = snake[0];
        const dx = point.x - head.x;
        const dy = point.y - head.y;
        const distance = Math.hypot(dx, dy);

        if (distance < 1) return;

        startPlaying();
        cancelCanvasDrag();
        target = { ...head };
        heading = {
          x: dx / distance,
          y: dy / distance
        };
        setStatus("Steering", "#8bd3ff");
      }

      function steerWithKey(event) {
        const key = event.key.toLowerCase();
        const directions = {
          w: { x: 0, y: -1 },
          a: { x: -1, y: 0 },
          s: { x: 0, y: 1 },
          d: { x: 1, y: 0 },
          arrowup: { x: 0, y: -1 },
          arrowleft: { x: -1, y: 0 },
          arrowdown: { x: 0, y: 1 },
          arrowright: { x: 1, y: 0 }
        };
        const direction = directions[key];

        if (!direction) return;
        event.preventDefault();
        if (dragging || joystickActive || controllerTouchState.active) return;
        lastControlSource = "device";
