        if (gameState === "over") {
          reset();
        }

        startPlaying();
        heading = direction;
        target = { ...snake[0] };
        setStatus("Steering", "#8bd3ff");
      }

      function handleActionKey(event) {
        if (event.repeat) return;
        if (event.target && event.target.closest && event.target.closest("button")) return;
        const key = event.key === " " ? "space" : event.key.toLowerCase();

        if (key === "space") {
          event.preventDefault();
          if (gameState === "over") {
            reset();
            startPlaying();
            setStatus("Coasting", "#8bd3ff");
          } else if (gameState === "ready") {
            startPlaying();
            setStatus("Coasting", "#8bd3ff");
          } else {
            togglePause();
          }
          return;
        }

        if (key === "p") {
          togglePause();
        } else if (key === "m") {
          toggleMute();
        } else if (key === "r") {
          reset();
        }
      }

      function moveDrag(event) {
        if (activePointerId !== null && event.pointerId !== activePointerId) return;
        if (!dragging || gameState !== "playing" || paused) return;
        event.preventDefault();
        const point = getCanvasPoint(event);
        target = clampArenaPoint({
          x: point.x + (dragOffset ? dragOffset.x : 0),
          y: point.y + (dragOffset ? dragOffset.y : 0)
        });
      }

      function endDrag(event) {
        if (activePointerId !== null && event.pointerId !== activePointerId) return;
        cancelCanvasDrag();
        if (
          event.pointerId !== undefined &&
          canvas.hasPointerCapture &&
          canvas.hasPointerCapture(event.pointerId)
        ) {
          canvas.releasePointerCapture(event.pointerId);
        }

        if (gameState === "playing" && !paused) {
          setStatus("Coasting", "#8bd3ff");
        }
      }

      function addHeadPoint(point) {
        snake[0] = point;
        const gapTarget = segmentGap();
        for (let i = 1; i < snake.length; i += 1) {
          const leader = snake[i - 1];
          const follower = snake[i];
          const dx = leader.x - follower.x;
          const dy = leader.y - follower.y;
          const gap = Math.hypot(dx, dy);

          if (gap > gapTarget) {
            const pull = (gap - gapTarget) / gap;
            follower.x += dx * pull;
            follower.y += dy * pull;
          }
        }
      }

      function extendTail() {
        const tail = snake[snake.length - 1];
        snake.push({ x: tail.x, y: tail.y });
      }

      function advanceHead(next, frameScale = 1) {
        const previous = { ...snake[0] };
        addHeadPoint(next);
        const movement = dist(previous, next);
        headMotion += movement;
        updateCameraFlow(previous, next, frameScale);
        checkFood();
        if (checkCollision()) {
          endGame();
          return false;
        }
        biteSelfGraceDistance = Math.max(0, biteSelfGraceDistance - movement);
        settleInvincibilityBites();
        return true;
      }

      function updateCameraFlow(previous, next, frameScale = 1) {
        const dx = next.x - previous.x;
        const dy = next.y - previous.y;
        const normalizedScale = Math.max(0.001, frameScale);
        targetCameraFlow = {
          x: -(dx / normalizedScale) * 13,
          y: -(dy / normalizedScale) * 13
        };
      }

      function moveHeadTowardTarget() {
        const head = snake[0];
        const dx = target.x - head.x;
        const dy = target.y - head.y;
        const distance = Math.hypot(dx, dy);

        if (distance < 0.2) return;

        heading = {
          x: dx / distance,
          y: dy / distance
        };

        const steps = Math.max(1, Math.ceil(distance / STEP));
        for (let i = 1; i <= steps; i += 1) {
          const next = {
            x: head.x + dx * (i / steps),
            y: head.y + dy * (i / steps)
          };
          if (!advanceHead(next)) break;
        }
      }

      function moveHeadWithJoystick(dt) {
        if (joystickPower <= 0) return;
        const head = snake[0];
        const frameScale = dt * NOMINAL_SIMULATION_FPS;
        const speed = lerp(JOYSTICK_MIN_STEP, JOYSTICK_MAX_STEP, joystickPower) * snakeSpeedScale() * frameScale;
        advanceHead({
          x: head.x + joystickVector.x * speed,
          y: head.y + joystickVector.y * speed
        }, frameScale);
      }

      function moveHeadWithGamepad(dt) {
        if (gamepadPower <= 0) return;
        const head = snake[0];
        const frameScale = dt * NOMINAL_SIMULATION_FPS;
        const speed = lerp(GAMEPAD_MIN_STEP, GAMEPAD_MAX_STEP, gamepadPower) * snakeSpeedScale() * frameScale;
        advanceHead({
          x: head.x + gamepadVector.x * speed,
          y: head.y + gamepadVector.y * speed
        }, frameScale);
      }

      function moveHeadIdle(dt) {
        const head = snake[0];
        const frameScale = dt * NOMINAL_SIMULATION_FPS;
        const speed = IDLE_STEP * snakeSpeedScale() * frameScale;
        advanceHead({
          x: head.x + heading.x * speed,
          y: head.y + heading.y * speed
        }, frameScale);
      }

      function moveFood(dt) {
        if (gameState === "over") return;

        const previous = { ...food };
        const radius = foodRadius();
        const speed = currentFoodSpeed() * dt * NOMINAL_SIMULATION_FPS;
        food.x += foodVelocity.x * speed;
        food.y += foodVelocity.y * speed;

        if (food.x <= radius || food.x >= ARENA.width - radius) {
          food.x = Math.max(radius, Math.min(ARENA.width - radius, food.x));
          foodVelocity.x *= -1;
        }

        if (food.y <= radius || food.y >= ARENA.height - radius) {
          food.y = Math.max(radius, Math.min(ARENA.height - radius, food.y));
          foodVelocity.y *= -1;
        }

        for (let i = 1; i < snake.length; i += 1) {
          const part = snake[i];
          if (dist(food, part) <= radius + bodyRadius()) {
            const dx = food.x - part.x;
            const dy = food.y - part.y;
            const len = Math.hypot(dx, dy) || 1;
            foodVelocity = {
              x: dx / len,
              y: dy / len
            };
            food.x = previous.x;
            food.y = previous.y;
            break;
          }
        }
      }

      function moveBonusFood(dt) {
        if (!bonusFood || gameState === "over") return;

        const frameScale = dt * NOMINAL_SIMULATION_FPS;
        const head = snake[0];
        const radius = bonusRadius();
        const awayX = bonusFood.x - head.x;
        const awayY = bonusFood.y - head.y;
        const awayLen = Math.hypot(awayX, awayY) || 1;
        const danger = Math.max(0, 1 - awayLen / 360);
        const centerX = ARENA.width * 0.5 - bonusFood.x;
        const centerY = ARENA.height * 0.5 - bonusFood.y;
        const centerLen = Math.hypot(centerX, centerY) || 1;
        const wallX =
          Math.max(0, BONUS_WALL_AVOID_DISTANCE - bonusFood.x) -
          Math.max(0, BONUS_WALL_AVOID_DISTANCE - (ARENA.width - bonusFood.x));
        const wallY =
          Math.max(0, BONUS_WALL_AVOID_DISTANCE - bonusFood.y) -
          Math.max(0, BONUS_WALL_AVOID_DISTANCE - (ARENA.height - bonusFood.y));
        const wallLen = Math.hypot(wallX, wallY) || 1;
        const wanderAngle = pulse * 1.15 + bonusFood.x * 0.006 + bonusFood.y * 0.004;
        const desired = {
          x:
            bonusVelocity.x * 0.58 +
            (awayX / awayLen) * (0.18 + danger * 0.42) +
            (wallX / wallLen) * 0.46 +
            (centerX / centerLen) * 0.1 +
            Math.cos(wanderAngle) * 0.16,
          y:
            bonusVelocity.y * 0.58 +
            (awayY / awayLen) * (0.18 + danger * 0.42) +
            (wallY / wallLen) * 0.46 +
            (centerY / centerLen) * 0.1 +
            Math.sin(wanderAngle * 1.17) * 0.16
        };

        const len = Math.hypot(desired.x, desired.y) || 1;
        const turnAmount = clamp(frameScale, 0, 1);
        bonusVelocity.x = lerp(bonusVelocity.x, desired.x / len, turnAmount);
        bonusVelocity.y = lerp(bonusVelocity.y, desired.y / len, turnAmount);
        normalizeBonusVelocity();

        const speed = currentFoodSpeed() * BONUS_SPEED_MULTIPLIER * frameScale;
        bonusFood.x += bonusVelocity.x * speed;
        bonusFood.y += bonusVelocity.y * speed;

        if (bonusFood.x <= radius || bonusFood.x >= ARENA.width - radius) {
          bonusFood.x = Math.max(radius, Math.min(ARENA.width - radius, bonusFood.x));
          bonusVelocity.x = bonusFood.x < ARENA.width * 0.5 ? Math.abs(bonusVelocity.x) : -Math.abs(bonusVelocity.x);
          bonusVelocity.y += Math.sin(pulse * 2.1) * 0.35;
        }

        if (bonusFood.y <= radius || bonusFood.y >= ARENA.height - radius) {
          bonusFood.y = Math.max(radius, Math.min(ARENA.height - radius, bonusFood.y));
          bonusVelocity.y = bonusFood.y < ARENA.height * 0.5 ? Math.abs(bonusVelocity.y) : -Math.abs(bonusVelocity.y);
          bonusVelocity.x += Math.cos(pulse * 2.3) * 0.35;
        }

        if (dist(head, bonusFood) <= headRadius() + radius) {
          spawnBiteBurst(
            bonusFood,
            { main: "#c9a7ff", accent: "#7ee7ff", glow: "rgba(201, 167, 255, 0.95)" },
            true
          );
          gulpAt = pulse;
          squintUntil = pulse + SQUINT_DURATION;
          if (swallowBulges.length < BULGE_LIMIT) {
            swallowBulges.push({ pos: 0, growth: 0 });
          }
          grantInvincibility();
          clearBonusFood();
          return;
        }

        normalizeBonusVelocity();
      }

      function normalizeBonusVelocity() {
        const len = Math.hypot(bonusVelocity.x, bonusVelocity.y) || 1;
        bonusVelocity.x /= len;
        bonusVelocity.y /= len;
      }

      function smoothBonusAngle(dt = frameDeltaSeconds) {
        const targetAngle = Math.atan2(bonusVelocity.y, bonusVelocity.x);
        const delta = Math.atan2(Math.sin(targetAngle - bonusAngle), Math.cos(targetAngle - bonusAngle));
        const turnAmount = 1 - Math.pow(1 - 0.12, dt * NOMINAL_SIMULATION_FPS);
        bonusAngle += delta * turnAmount;
        return bonusAngle;
      }

      function invincibleBiteLimit() {
        return Math.max(INVINCIBLE_BITE_LIMIT, Math.floor(currentFoodQuota() / 2));
      }

      function grantInvincibility() {
        resetCombo();
        invincibleWarningUntil = 0;
        invincibleBitesRemaining = invincibleBiteLimit();
        invincibleUntil = performance.now() + INVINCIBLE_DURATION_MS;
        pendingInvincibleBites = 0;
        switchMusic("invincible");
        setStatus(`Invincible ${invincibleBitesRemaining}`, "#c9a7ff");
        playHaptic("reward");
        rewardBiteSound();
      }

      function isInvincibilityWarningActive() {
        return invincibleWarningUntil > performance.now();
      }

      function invincibilityWarningRemaining() {
        return Math.max(0, (invincibleWarningUntil - performance.now()) / 1000);
      }

      function isInvincibleMode() {
        return invincibleBitesRemaining > 0 || isInvincibilityWarningActive();
      }

      function ensureAudioContext() {
        if (muted) return null;
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return null;
        audioCtx = audioCtx || new AudioContextClass();
        return audioCtx;
      }

      function resumeAudioContext() {
        if (!audioCtx || audioCtx.state !== "suspended") return null;
        try {
          const resumeAttempt = audioCtx.resume();
          if (resumeAttempt && typeof resumeAttempt.catch === "function") {
            resumeAttempt.catch(() => {});
          }
          return resumeAttempt;
        } catch (error) {
          return null;
        }
      }

      function unlockSfxAudio() {
        const ctx = ensureAudioContext();
        if (!ctx) return;

        const resumeAttempt = resumeAudioContext();
        if (sfxUnlocked) return;

        try {
          const now = ctx.currentTime;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = "sine";
          osc.frequency.setValueAtTime(40, now);
          gain.gain.setValueAtTime(0.0001, now);
          gain.gain.exponentialRampToValueAtTime(0.00001, now + 0.03);
          osc.connect(gain).connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.035);
          sfxUnlocked = true;

          if (resumeAttempt && typeof resumeAttempt.catch === "function") {
            resumeAttempt.catch(() => {
              sfxUnlocked = false;
            });
          }
        } catch (error) {
          sfxUnlocked = false;
        }
      }

      function playInvincibilityEndingCue() {
        if (muted) return;
        try {
          if (!ensureAudioContext()) return;
          resumeAudioContext();
          const now = audioCtx.currentTime;
          const master = audioCtx.createGain();
          master.gain.setValueAtTime(0.42, now);
          master.connect(audioCtx.destination);

          [880, 740, 554].forEach((frequency, index) => {
            const start = now + index * 0.48;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = "triangle";
            osc.frequency.setValueAtTime(frequency, start);
            osc.frequency.exponentialRampToValueAtTime(frequency * 0.78, start + 0.16);
            gain.gain.setValueAtTime(0.001, start);
            gain.gain.exponentialRampToValueAtTime(0.08, start + 0.025);
            gain.gain.exponentialRampToValueAtTime(0.001, start + 0.22);
            osc.connect(gain).connect(master);
            osc.start(start);
            osc.stop(start + 0.24);
          });
        } catch (error) {
          muted = true;
          updateMuteIcon();
        }
      }

      function startInvincibilityWarning() {
        if (isInvincibilityWarningActive()) return;
        invincibleBitesRemaining = 0;
        pendingInvincibleBites = 0;
        invincibleUntil = 0;
        invincibleWarningUntil = performance.now() + INVINCIBLE_ENDING_WARNING_MS;
        playInvincibilityEndingCue();
        playHaptic("warning");
        setStatus(`Invincible ending ${invincibilityWarningRemaining().toFixed(1)}`, "#ffd166");
      }

      function updateWarningMusicEffect() {
        if (musicMode !== "invincible" || !currentMusicTrack) return;
        const total = INVINCIBLE_ENDING_WARNING_MS / 1000;
        const progress = clamp(1 - invincibilityWarningRemaining() / total, 0, 1);
        const config = musicConfig("invincible");
        if (!musicFadeFrame) {
          currentMusicTrack.volume = lerp(config.volume, config.volume * WARNING_MUSIC_DUCK_FACTOR, progress);
        }
        if ("preservesPitch" in currentMusicTrack) {
          currentMusicTrack.preservesPitch = false;
        }
        currentMusicTrack.playbackRate = lerp(1, WARNING_MUSIC_MIN_RATE, progress);
      }

      function finishInvincibility() {
        invincibleWarningUntil = 0;
        invincibleBitesRemaining = 0;
        pendingInvincibleBites = 0;
        invincibleUntil = 0;
        if (musicTracks && musicTracks.invincible) {
          musicTracks.invincible.playbackRate = 1;
        }
        switchMusic("normal");
        setStatus("Vulnerable", "#ffcf5a");
        maybePlaceBonusFood();
      }

      function updateInvincibilityWarning() {
        if (invincibleUntil && invincibleBitesRemaining > 0 && performance.now() >= invincibleUntil) {
          startInvincibilityWarning();
        }
        if (!invincibleWarningUntil) return;
        if (isInvincibilityWarningActive()) {
          updateWarningMusicEffect();
          setStatus(`Invincible ending ${invincibilityWarningRemaining().toFixed(1)}`, "#ffd166");
          return;
        }
        finishInvincibility();
      }

      function checkFood() {
        if (dist(snake[0], food) <= headRadius() + foodRadius()) {
          eatFood();
          return true;
        }
        return false;
      }

      function eatFood() {
        const eatenFood = { ...food };
        const eatenTheme = currentFoodTheme();
        const basePoints = currentFoodValue();
        const combo = updateCombo();
        const points = basePoints * combo.multiplier;
        score += points;
        scoreEl.textContent = score;
        spawnBiteBurst(eatenFood, eatenTheme);
        spawnScorePopup(eatenFood, points, combo.multiplier, eatenTheme);
        gulpAt = pulse;
        squintUntil = pulse + SQUINT_DURATION;
        if (swallowBulges.length < BULGE_LIMIT) {
          swallowBulges.push({ pos: 0, growth: GROWTH_PER_BITE });
        } else {
          swallowBulges[swallowBulges.length - 1].growth += GROWTH_PER_BITE;
        }
        biteSelfGraceDistance = Math.max(biteSelfGraceDistance, biteSelfGraceLimit());
        foodLevelBites += 1;
        bonusBiteCountdown -= 1;
        const wasInvincible = isInvincibleMode();
        if (wasInvincible) {
          pendingInvincibleBites += 1;
        }
        const levelUp = foodLevelBites >= currentFoodQuota();
        if (levelUp) {
          foodLevel += 1;
          foodLevelBites = 0;
          updateOceanFlow();
          shimmerAt = pulse;
          resetCombo();
          if (bonusFood) {
            clearBonusFood();
          }
        }
        placeFood();
        const placedBonusFood = maybePlaceBonusFood();
        if (!placedBonusFood && isInvincibilityWarningActive()) {
          setStatus(`Invincible ending ${invincibilityWarningRemaining().toFixed(1)}`, "#ffd166");
        } else if (!placedBonusFood && remainingInvincibleBites() > 0) {
          const comboCopy = !levelUp && combo.count > 1 ? ` | ${comboStatus(combo, points)}` : "";
          setStatus(`Invincible ${remainingInvincibleBites()}${comboCopy}`, "#c9a7ff");
        } else if (!placedBonusFood) {
          setStatus(levelUp ? "Color up" : comboStatus(combo, points), currentFoodTheme().main);
        }
        if (levelUp) {
          playHaptic("reward");
          rewardBiteSound(combo);
        } else {
          playHaptic(combo.count > 1 ? "combo" : "bite");
          snackBite(combo);
        }
      }

      function remainingInvincibleBites() {
        if (isInvincibilityWarningActive()) return 0;
        return Math.max(0, invincibleBitesRemaining - pendingInvincibleBites);
      }

      function settleInvincibilityBites() {
        if (pendingInvincibleBites <= 0) return;
        if (isInvincibilityWarningActive()) {
          pendingInvincibleBites = 0;
          return;
        }
        const wasInvincible = isInvincibleMode();
        invincibleBitesRemaining = Math.max(0, invincibleBitesRemaining - pendingInvincibleBites);
        pendingInvincibleBites = 0;
        if (wasInvincible && !isInvincibleMode()) {
          startInvincibilityWarning();
        }
        maybePlaceBonusFood();
      }

      function checkCollision() {
        const head = snake[0];
        if (
          head.x <= headRadius() ||
          head.y <= headRadius() ||
          head.x >= ARENA.width - headRadius() ||
          head.y >= ARENA.height - headRadius()
        ) {
          return true;
        }

        if (!isInvincibleMode() && biteSelfGraceDistance <= 0) {
          for (let i = SELF_GRACE; i < snake.length; i += 1) {
            if (dist(head, snake[i]) < headRadius() + bodyRadius() - 5 * snakeScale()) {
              return true;
            }
          }
        }

        return false;
      }

      function endGame() {
        gameState = "over";
        deathAt = pulse;
        deathBubbleTimer = 0;
        swallowBulges.length = 0;
        cancelCanvasDrag();
        resetJoystick();
        target = { ...snake[0] };
        invincibleBitesRemaining = 0;
        pendingInvincibleBites = 0;
        invincibleWarningUntil = 0;
        invincibleUntil = 0;
        best = Math.max(best, score);
        localStorage.setItem(BEST_SCORE_STORAGE_KEY, String(best));
        bestEl.textContent = best;
        setOverlay("gameover", "Game Over", "The reef reclaims another hunter.");
        setStatus("Collision", "#ff5f6d");
        stopMusic();
        playHaptic("collision");
        failureSound();
      }

      function beep(frequency, duration, type, volume) {
        if (muted) return;
        try {
          if (!ensureAudioContext()) return;
          resumeAudioContext();
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = type;
          osc.frequency.value = frequency;
          gain.gain.setValueAtTime(volume, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
          osc.connect(gain).connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + duration);
        } catch (error) {
          muted = true;
          updateMuteIcon();
        }
      }

      function failureSound() {
        if (muted) return;
        try {
          if (!ensureAudioContext()) return;
          resumeAudioContext();
          const now = audioCtx.currentTime;
          const master = audioCtx.createGain();
          const compressor = audioCtx.createDynamicsCompressor();
          compressor.threshold.setValueAtTime(-16, now);
          compressor.knee.setValueAtTime(18, now);
          compressor.ratio.setValueAtTime(5, now);
          compressor.attack.setValueAtTime(0.003, now);
          compressor.release.setValueAtTime(0.16, now);
          master.gain.setValueAtTime(0.72, now);
          master.connect(compressor).connect(audioCtx.destination);

          const fall = audioCtx.createOscillator();
          const fallGain = audioCtx.createGain();
          fall.type = "sawtooth";
          fall.frequency.setValueAtTime(260, now);
          fall.frequency.exponentialRampToValueAtTime(72, now + 0.34);
          fallGain.gain.setValueAtTime(0.08, now);
          fallGain.gain.exponentialRampToValueAtTime(0.001, now + 0.38);
          fall.connect(fallGain).connect(master);
          fall.start(now);
          fall.stop(now + 0.4);

          const thud = audioCtx.createOscillator();
          const thudGain = audioCtx.createGain();
          thud.type = "sine";
          thud.frequency.setValueAtTime(86, now + 0.18);
          thud.frequency.exponentialRampToValueAtTime(42, now + 0.42);
          thudGain.gain.setValueAtTime(0.001, now + 0.16);
          thudGain.gain.exponentialRampToValueAtTime(0.13, now + 0.2);
          thudGain.gain.exponentialRampToValueAtTime(0.001, now + 0.48);
          thud.connect(thudGain).connect(master);
          thud.start(now + 0.16);
          thud.stop(now + 0.5);

          const noiseBuffer = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.18, audioCtx.sampleRate);
          const samples = noiseBuffer.getChannelData(0);
          for (let i = 0; i < samples.length; i += 1) {
            const envelope = 1 - i / samples.length;
            samples[i] = (Math.random() * 2 - 1) * envelope * envelope * 0.45;
          }

          const noise = audioCtx.createBufferSource();
          const noiseFilter = audioCtx.createBiquadFilter();
          const noiseGain = audioCtx.createGain();
          noise.buffer = noiseBuffer;
          noiseFilter.type = "lowpass";
          noiseFilter.frequency.setValueAtTime(520, now + 0.1);
          noiseGain.gain.setValueAtTime(0.001, now + 0.08);
          noiseGain.gain.exponentialRampToValueAtTime(0.045, now + 0.12);
          noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.27);
          noise.connect(noiseFilter).connect(noiseGain).connect(master);
          noise.start(now + 0.08);
          noise.stop(now + 0.28);
        } catch (error) {
          muted = true;
          updateMuteIcon();
        }
      }

      function comboPitch(combo) {
        if (!combo) return 1;
        return Math.min(1.7, 1 + Math.max(0, combo.count - 1) * 0.055 + (combo.multiplier - 1) * 0.08);
      }

      function snackBite(combo = null) {
        if (muted) return;
        try {
          if (!ensureAudioContext()) return;
          resumeAudioContext();
          const now = audioCtx.currentTime;
          const pitch = comboPitch(combo);
          const comboLift = combo && combo.count > 1 ? Math.min(0.04, combo.count * 0.004) : 0;
          const master = audioCtx.createGain();
          const compressor = audioCtx.createDynamicsCompressor();
          compressor.threshold.setValueAtTime(-18, now);
          compressor.knee.setValueAtTime(18, now);
          compressor.ratio.setValueAtTime(4, now);
          compressor.attack.setValueAtTime(0.004, now);
          compressor.release.setValueAtTime(0.08, now);
          master.gain.setValueAtTime(0.76, now);
          master.connect(compressor).connect(audioCtx.destination);

          const crunchBuffer = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.075, audioCtx.sampleRate);
          const samples = crunchBuffer.getChannelData(0);
          for (let i = 0; i < samples.length; i += 1) {
            const envelope = 1 - i / samples.length;
            samples[i] = (Math.random() * 2 - 1) * envelope * envelope * 0.65;
          }

          const crunch = audioCtx.createBufferSource();
          const crunchFilter = audioCtx.createBiquadFilter();
          const crunchGain = audioCtx.createGain();
          crunch.buffer = crunchBuffer;
          crunchFilter.type = "highpass";
          crunchFilter.frequency.setValueAtTime(2300, now);
          crunchFilter.Q.setValueAtTime(0.9, now);
          crunchGain.gain.setValueAtTime(0.045, now);
          crunchGain.gain.exponentialRampToValueAtTime(0.001, now + 0.07);
          crunch.connect(crunchFilter).connect(crunchGain).connect(master);
          crunch.start(now);
          crunch.stop(now + 0.08);

          const pop = audioCtx.createOscillator();
          const popGain = audioCtx.createGain();
          pop.type = "sine";
          pop.frequency.setValueAtTime(170 * pitch, now);
          pop.frequency.exponentialRampToValueAtTime(96 * pitch, now + 0.075);
          popGain.gain.setValueAtTime(0.11 + comboLift, now);
          popGain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
          pop.connect(popGain).connect(master);
          pop.start(now);
          pop.stop(now + 0.1);

          const chime = audioCtx.createOscillator();
          const chimeGain = audioCtx.createGain();
          chime.type = "triangle";
          chime.frequency.setValueAtTime(660 * pitch, now + 0.015);
          chime.frequency.exponentialRampToValueAtTime(880 * pitch, now + 0.12);
          chimeGain.gain.setValueAtTime(0.001, now);
          chimeGain.gain.exponentialRampToValueAtTime(0.065 + comboLift, now + 0.018);
          chimeGain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
          chime.connect(chimeGain).connect(master);
          chime.start(now + 0.012);
          chime.stop(now + 0.19);

          const sparkle = audioCtx.createOscillator();
          const sparkleGain = audioCtx.createGain();
          sparkle.type = "sine";
          sparkle.frequency.setValueAtTime(1320 * pitch, now + 0.045);
          sparkleGain.gain.setValueAtTime(0.001, now + 0.035);
          sparkleGain.gain.exponentialRampToValueAtTime(0.025 + comboLift * 0.8, now + 0.052);
          sparkleGain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
          sparkle.connect(sparkleGain).connect(master);
          sparkle.start(now + 0.04);
          sparkle.stop(now + 0.15);

          if (combo && combo.count > 1) {
            const comboPing = audioCtx.createOscillator();
            const comboGain = audioCtx.createGain();
            comboPing.type = "sine";
            comboPing.frequency.setValueAtTime(1046.5 * pitch, now + 0.085);
            comboGain.gain.setValueAtTime(0.001, now + 0.075);
            comboGain.gain.exponentialRampToValueAtTime(0.024 + comboLift, now + 0.095);
            comboGain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
            comboPing.connect(comboGain).connect(master);
            comboPing.start(now + 0.08);
            comboPing.stop(now + 0.24);
          }
        } catch (error) {
          muted = true;
          updateMuteIcon();
        }
      }

      function rewardBiteSound(combo = null) {
        if (muted) return;

          if (!ensureAudioContext()) return;
          resumeAudioContext();
          const now = audioCtx.currentTime;
          const pitch = comboPitch(combo);
          const master = audioCtx.createGain();

          compressor.knee.setValueAtTime(20, now);
          compressor.ratio.setValueAtTime(3, now);
          compressor.attack.setValueAtTime(0.006, now);
          compressor.release.setValueAtTime(0.16, now);
          master.gain.setValueAtTime(0.72, now);

          const notes = [523.25, 659.25, 783.99, 1046.5];

            gain.gain.exponentialRampToValueAtTime(0.001, start + 0.34);
            osc.connect(gain).connect(master);
            osc.start(start);
            osc.stop(start + 0.36);
          });

          const bass = audioCtx.createOscillator();

          bass.frequency.exponentialRampToValueAtTime(130.81, now + 0.16);
          bassGain.gain.setValueAtTime(0.09, now);
          bassGain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);

          const sparkle = audioCtx.createOscillator();

          sparkle.type = "sine";

          sparkle.frequency.exponentialRampToValueAtTime(2093 * pitch, now + 0.46);
          sparkleGain.gain.setValueAtTime(0.001, now + 0.2);
          sparkleGain.gain.exponentialRampToValueAtTime(0.034, now + 0.25);

          const crunchBuffer = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.055, audioCtx.sampleRate);
