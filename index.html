            const envelope = 1 - i / samples.length;
            samples[i] = (Math.random() * 2 - 1) * envelope * envelope * 0.34;
          }

          const crunch = audioCtx.createBufferSource();
          const crunchFilter = audioCtx.createBiquadFilter();
          const crunchGain = audioCtx.createGain();
          crunch.buffer = crunchBuffer;
          crunchFilter.type = "highpass";
          crunchFilter.frequency.setValueAtTime(2600, now);
          crunchGain.gain.setValueAtTime(0.028, now);
          crunchGain.gain.exponentialRampToValueAtTime(0.001, now + 0.055);
          crunch.connect(crunchFilter).connect(crunchGain).connect(master);
          crunch.start(now);
          crunch.stop(now + 0.06);
        } catch (error) {
          muted = true;
          updateMuteIcon();
        }
      }

      function createCausticsTile() {
        const size = CAUSTICS_TILE_SIZE;
        causticsTile = document.createElement("canvas");
        causticsTile.width = size;
        causticsTile.height = size;
        const tileCtx = causticsTile.getContext("2d");
        tileCtx.strokeStyle = "#ffffff";
        tileCtx.lineCap = "round";
        for (let i = 0; i < CAUSTICS_BLOB_COUNT; i += 1) {
          const seed = i * 131 + 17;
          const x = (seed * 97) % size;
          const y = (seed * 61) % size;
          const radius = 9 + (seed % 23);
          const squash = 0.55 + ((seed % 7) / 7) * 0.5;
          const rotation = ((seed % 13) / 13) * Math.PI;
          const start = ((seed % 11) / 11) * Math.PI * 2;
          const sweep = Math.PI * (0.9 + ((seed % 5) / 5) * 0.9);
          tileCtx.lineWidth = 1.5 + (seed % 4) * 0.8;
          tileCtx.globalAlpha = 0.22 + ((seed % 6) / 6) * 0.4;
          for (const wrapX of [-size, 0, size]) {
            for (const wrapY of [-size, 0, size]) {
              tileCtx.beginPath();
              tileCtx.ellipse(x + wrapX, y + wrapY, radius, radius * squash, rotation, start, start + sweep);
              tileCtx.stroke();
            }
          }
        }
      }

      function ensureArenaGradients(pal) {
        const key = `${ARENA.width}x${ARENA.height}`;
        if (arenaGradients && arenaGradients.key === key && !arenaPaletteDirty) return;
        const width = ARENA.width;
        const height = ARENA.height;
        const bg = ctx.createLinearGradient(0, 0, 0, height);
        bg.addColorStop(0, rgbaStr(pal.top, 1));
        bg.addColorStop(0.42, rgbaStr(pal.mid, 1));
        bg.addColorStop(1, rgbaStr(pal.deep, 1));
        const glow = ctx.createRadialGradient(width * 0.5, 0, 0, width * 0.5, 0, height * 0.78);
        glow.addColorStop(0, "rgba(126, 231, 255, 0.18)");
        glow.addColorStop(0.45, rgbaStr(pal.glow, 0.72));
        glow.addColorStop(1, "rgba(0, 0, 0, 0)");
        const rayCyan = ctx.createLinearGradient(0, 0, 0, height * GOD_RAY_FADE_FRACTION);
        rayCyan.addColorStop(0, "rgba(126, 231, 255, 0.5)");
        rayCyan.addColorStop(1, "rgba(126, 231, 255, 0)");
        const rayGlow = ctx.createLinearGradient(0, 0, 0, height * GOD_RAY_FADE_FRACTION);
        rayGlow.addColorStop(0, rgbaStr(pal.glow, 0.5));
        rayGlow.addColorStop(1, rgbaStr(pal.glow, 0));
        const fog = ctx.createLinearGradient(0, height * FOG_TOP_FRACTION, 0, height);
        fog.addColorStop(0, rgbaStr(pal.deep, 0));
        fog.addColorStop(1, rgbaStr(pal.deep, FOG_MAX_ALPHA));
        const vignette = ctx.createRadialGradient(
          width * 0.5,
          height * 0.5,
          Math.min(width, height) * 0.42,
          width * 0.5,
          height * 0.5,
          Math.hypot(width, height) * 0.55
        );
        vignette.addColorStop(0, "rgba(1, 6, 12, 0)");
        vignette.addColorStop(1, `rgba(1, 6, 12, ${VIGNETTE_ALPHA})`);
        const wallShade = "rgba(1, 8, 14, 0.38)";
        const wallClear = "rgba(1, 8, 14, 0)";
        const wallTop = ctx.createLinearGradient(0, 0, 0, WALL_SHADOW_DEPTH);
        wallTop.addColorStop(0, wallShade);
        wallTop.addColorStop(1, wallClear);
        const wallBottom = ctx.createLinearGradient(0, height, 0, height - WALL_SHADOW_DEPTH);
        wallBottom.addColorStop(0, wallShade);
        wallBottom.addColorStop(1, wallClear);
        const wallLeft = ctx.createLinearGradient(0, 0, WALL_SHADOW_DEPTH, 0);
        wallLeft.addColorStop(0, wallShade);
        wallLeft.addColorStop(1, wallClear);
        const wallRight = ctx.createLinearGradient(width, 0, width - WALL_SHADOW_DEPTH, 0);
        wallRight.addColorStop(0, wallShade);
        wallRight.addColorStop(1, wallClear);
        arenaGradients = { key, bg, glow, rayCyan, rayGlow, fog, vignette, wallTop, wallBottom, wallLeft, wallRight };
        arenaPaletteDirty = false;
      }

      function drawBgFish() {
        if (!bgFish || !bgFish.length) return;
        ctx.save();
        ctx.globalCompositeOperation = "source-over";
        ctx.fillStyle = "rgba(4, 18, 28, 0.6)";
        ctx.globalAlpha = 0.55;
        bgFish.forEach((school) => {
          school.fish.forEach((fish) => {
            const size = fish.size;
            ctx.save();
            ctx.translate(
              school.x + fish.dx * school.dir,
              school.y + fish.dy + Math.sin(pulse * 2.1 + fish.phase) * 4
            );
            ctx.scale(school.dir, 1);
            ctx.beginPath();
            ctx.moveTo(size, 0);
            ctx.quadraticCurveTo(0, -size * 0.45, -size * 0.7, 0);
            ctx.lineTo(-size * 1.15, -size * 0.4);
            ctx.lineTo(-size * 0.95, 0);
            ctx.lineTo(-size * 1.15, size * 0.4);
            ctx.lineTo(-size * 0.7, 0);
            ctx.quadraticCurveTo(0, size * 0.45, size, 0);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
          });
        });
        ctx.restore();
      }

      function drawDepthLayers(pal, cameraX, cameraY) {
        ctx.save();
        ctx.globalCompositeOperation = "source-over";

        for (let layer = 0; layer < 3; layer += 1) {
          const depth = 0.24 + layer * 0.18;
          const baseline = ARENA.height * (0.72 + layer * 0.09);
          const drift = (pulse * (8 + layer * 5) + cameraX * depth * 0.35) % 190;
          ctx.globalAlpha = 0.09 + layer * 0.045;
          ctx.fillStyle = layer === 0 ? "rgba(2, 12, 20, 0.78)" : "rgba(4, 25, 34, 0.72)";
          ctx.beginPath();
          ctx.moveTo(0, ARENA.height);
          for (let x = -190; x <= ARENA.width + 190; x += 38) {
            const px = x - drift;
            const wave = Math.sin((x + layer * 71) * 0.025 + pulse * (0.12 + layer * 0.04)) * (10 + layer * 7);
            const ridge = Math.sin((x + layer * 31) * 0.011) * (18 + layer * 8);
            ctx.lineTo(px, baseline + wave + ridge + cameraY * depth * 0.18);
          }
          ctx.lineTo(ARENA.width, ARENA.height);
          ctx.closePath();
          ctx.fill();

          ctx.strokeStyle = layer === 2 ? rgbaStr(pal.glow, 0.72) : "rgba(126, 231, 255, 0.18)";
          ctx.lineWidth = 1 + layer * 0.4;
          ctx.globalAlpha = 0.035 + layer * 0.03;
          for (let i = 0; i < 10; i += 1) {
            const seed = i * 89 + layer * 47;
            const baseX = ((seed * 13 + pulse * (10 + layer * 7) - cameraX * depth * 0.18) % (ARENA.width + 160)) - 80;
            const baseY = baseline + 14 + Math.sin(seed) * 16;
            const height = 30 + (seed % 6) * 8 + layer * 18;
            ctx.beginPath();
            ctx.moveTo(baseX, baseY);
            ctx.bezierCurveTo(
              baseX + Math.sin(pulse * 0.8 + seed) * 12,
              baseY - height * 0.35,
              baseX - Math.cos(pulse * 0.6 + seed) * 16,
              baseY - height * 0.72,
              baseX + Math.sin(pulse * 0.5 + seed) * 11,
              baseY - height
            );
            ctx.stroke();
          }
        }

        ctx.restore();
      }

      function drawArena() {
        const pal = arenaPalette || ARENA_PALETTES[0];
        if (!causticsTile) createCausticsTile();
        ensureArenaGradients(pal);
        const mobile = isMobileLayout();
        const flowMotion = oceanFlow ? Math.hypot(oceanFlow.x, oceanFlow.y) / OCEAN_BASE_SPEED : 1;
        const cameraX = cameraFlow ? cameraFlow.x : 0;
        const cameraY = cameraFlow ? cameraFlow.y : 0;
        ctx.fillStyle = arenaGradients.bg;
        ctx.fillRect(0, 0, ARENA.width, ARENA.height);

        ctx.save();
        ctx.globalCompositeOperation = "screen";
        const cameraMagnitude = Math.hypot(cameraX, cameraY);

        ctx.globalAlpha = 0.2;
        ctx.fillStyle = arenaGradients.glow;
        ctx.fillRect(0, 0, ARENA.width, ARENA.height);

        const causticsBand = ARENA.height * CAUSTICS_BAND_FRACTION;
        const causticsLayers = mobile ? 1 : CAUSTICS_LAYER_SCALES.length;
        for (let layer = 0; layer < causticsLayers; layer += 1) {
          const tile = CAUSTICS_TILE_SIZE * CAUSTICS_LAYER_SCALES[layer];
          const scrollX = pulse * (7 + layer * 5) + oceanFlow.x * (0.35 + layer * 0.2);
          const offsetX = ((scrollX % tile) + tile) % tile;
          const scrollY = pulse * (2.5 + layer * 1.5);
          const offsetY = ((scrollY % tile) + tile) % tile;
          for (let y = -offsetY; y < causticsBand; y += tile) {
            const rowAlpha = CAUSTICS_LAYER_ALPHAS[layer] * Math.max(0, 1 - (y + tile * 0.6) / causticsBand);
            if (rowAlpha <= 0.004) continue;
            ctx.globalAlpha = rowAlpha;
            for (let x = -offsetX; x < ARENA.width; x += tile) {
              ctx.drawImage(causticsTile, x, y, tile, tile);
            }
          }
        }

        ctx.globalAlpha = SURFACE_BAND_ALPHA;
        ctx.fillStyle = "rgba(226, 251, 255, 1)";
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(ARENA.width, 0);
        ctx.lineTo(ARENA.width, 10);
        for (let x = ARENA.width; x >= 0; x -= 32) {
          ctx.lineTo(x, 10 + Math.sin(x * 0.02 + pulse * 0.9) * 3);
        }
        ctx.lineTo(0, 10);
        ctx.closePath();
        ctx.fill();

        drawDepthLayers(pal, cameraX, cameraY);
        drawBgFish();

        const beamCount = mobile ? GOD_RAY_COUNT_MOBILE : GOD_RAY_COUNT;
        const beamSpacing = (ARENA.width + 180) / beamCount;
        for (let i = 0; i < beamCount; i += 1) {
          const beamX = (oceanLight.x + i * beamSpacing + Math.sin(pulse * 0.13 + i) * 18) % (ARENA.width + 180) - 90;
          const lean = oceanLight.lean * ARENA.height + Math.sin(pulse * 0.18 + i) * 16;
          ctx.globalAlpha = 0.05 + (i % 3) * 0.018;
          ctx.fillStyle = i % 2 === 0 ? arenaGradients.rayCyan : arenaGradients.rayGlow;
          ctx.beginPath();
          ctx.moveTo(beamX, 0);
          ctx.lineTo(beamX + 80, 0);
          ctx.lineTo(beamX + lean + 190, ARENA.height);
          ctx.lineTo(beamX + lean - 90, ARENA.height);
          ctx.closePath();
          ctx.fill();
        }

        const planktonColor = rgbaStr(pal.accent, 0.6);
        const deepMoteColor = rgbaStr(pal.glow, 0.72);
        oceanParticles.forEach((particle) => {
          if (particle.bubble) {
            ctx.globalAlpha = 0.2 + particle.depth * 0.22;
            if (cameraMagnitude > 8) {
              ctx.strokeStyle = "rgba(226, 251, 255, 0.18)";
              ctx.lineWidth = Math.max(1, particle.r * 0.38);
              ctx.beginPath();
              ctx.moveTo(particle.x + cameraX * 0.13, particle.y + cameraY * 0.13);
              ctx.lineTo(particle.x - cameraX * 0.08, particle.y - cameraY * 0.08);
              ctx.stroke();
            }
            ctx.strokeStyle = "rgba(226, 251, 255, 0.82)";
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.arc(particle.x, particle.y, particle.r, 0, Math.PI * 2);
            ctx.stroke();
            ctx.fillStyle = "rgba(226, 251, 255, 0.12)";
          } else if (particle.plankton) {
            ctx.globalAlpha =
              (0.1 + particle.depth * 0.2) * (0.6 + 0.4 * Math.sin(pulse * 2 + particle.sway));
            ctx.fillStyle = planktonColor;
          } else {
            ctx.globalAlpha =
              (0.08 + particle.depth * 0.16) *
              (0.72 + 0.28 * Math.sin(pulse * (1.1 + particle.depth * 1.6) + particle.sway * 7));
            ctx.fillStyle = particle.depth > 0.8 ? deepMoteColor : "rgba(194, 238, 246, 0.52)";
          }
          ctx.beginPath();
          ctx.arc(particle.x, particle.y, particle.r, 0, Math.PI * 2);
          ctx.fill();
        });

        const bubbleCount = mobile ? AQUARIUM_BUBBLE_COUNT_MOBILE : AQUARIUM_BUBBLE_COUNT;
        const bubblerX = ARENA.width * 0.955;
        ctx.strokeStyle = "rgba(226, 251, 255, 0.82)";
        ctx.lineWidth = 1;
        for (let i = 0; i < bubbleCount; i += 1) {
          const cycle = ARENA.height * 0.88;
          const bubbleY = ARENA.height * 0.94 - ((pulse * 46 + i * ARENA.height * 0.115) % cycle);
          const bubbleX = bubblerX + Math.sin(pulse * 2 + i * 1.7) * 6;
          const bubbleR = Math.max(1, (1.4 + (i % 3) * 0.8) * snakeScale());
          ctx.globalAlpha = 0.35 * clamp(bubbleY / ARENA.height, 0, 1);
          ctx.beginPath();
          ctx.arc(bubbleX, bubbleY, bubbleR, 0, Math.PI * 2);
          ctx.stroke();
        }
        ctx.globalAlpha = 0.5;
        ctx.fillStyle = "rgba(180, 210, 224, 0.6)";
        ctx.beginPath();
        ctx.arc(bubblerX, ARENA.height * 0.955, Math.max(2, 3 * snakeScale()), 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        ctx.strokeStyle = "rgba(126, 231, 255, 0.06)";
        ctx.lineWidth = 1.4;
        for (let y = 58; y < ARENA.height; y += 58) {
          const wave = Math.sin(pulse * 0.7 + y * 0.025) * 18 * flowMotion;
          ctx.beginPath();
          for (let x = -24; x <= ARENA.width + 24; x += 24) {
            const py = y + Math.sin(x * 0.015 + pulse * 0.55 + y * 0.02) * 4 + wave * 0.08;
            if (x === -24) ctx.moveTo(x, py);
            else ctx.lineTo(x, py);
          }
          ctx.stroke();
        }

        ctx.save();
        ctx.globalAlpha = 0.85 + Math.sin(pulse * 0.35) * 0.15;
        ctx.fillStyle = arenaGradients.fog;
        ctx.fillRect(0, ARENA.height * FOG_TOP_FRACTION, ARENA.width, ARENA.height * (1 - FOG_TOP_FRACTION));
        ctx.restore();

        ctx.fillStyle = arenaGradients.wallTop;
        ctx.fillRect(0, 0, ARENA.width, WALL_SHADOW_DEPTH);
        ctx.fillStyle = arenaGradients.wallBottom;
        ctx.fillRect(0, ARENA.height - WALL_SHADOW_DEPTH, ARENA.width, WALL_SHADOW_DEPTH);
        ctx.fillStyle = arenaGradients.wallLeft;
        ctx.fillRect(0, 0, WALL_SHADOW_DEPTH, ARENA.height);
        ctx.fillStyle = arenaGradients.wallRight;
        ctx.fillRect(ARENA.width - WALL_SHADOW_DEPTH, 0, WALL_SHADOW_DEPTH, ARENA.height);

        const shimmerT = (pulse - shimmerAt) / SHIMMER_DURATION;
        if (shimmerT >= 0 && shimmerT <= 1) {
          const sweepX = (-0.35 + shimmerT * 1.7) * ARENA.width;
          const shimmer = ctx.createLinearGradient(
            sweepX - ARENA.width * 0.28,
            0,
            sweepX + ARENA.width * 0.28,
            ARENA.height * 0.9
          );
          shimmer.addColorStop(0, "rgba(255, 255, 255, 0)");
          shimmer.addColorStop(0.5, rgbaStr(pal.glow, 0.5));
          shimmer.addColorStop(1, "rgba(255, 255, 255, 0)");
          ctx.save();
          ctx.globalCompositeOperation = "screen";
          ctx.globalAlpha = SHIMMER_MAX_ALPHA * Math.sin(Math.PI * shimmerT);
          ctx.fillStyle = shimmer;
          ctx.fillRect(0, 0, ARENA.width, ARENA.height);
          ctx.restore();
        }

        ctx.globalAlpha = 1;
        ctx.fillStyle = arenaGradients.vignette;
        ctx.fillRect(0, 0, ARENA.width, ARENA.height);

        ctx.strokeStyle = "rgba(2, 10, 18, 0.9)";
        ctx.lineWidth = 6;
        ctx.strokeRect(8, 8, ARENA.width - 16, ARENA.height - 16);
        ctx.strokeStyle = rgbaStr(pal.glow, 0.72);
        ctx.lineWidth = 4;
        ctx.strokeRect(12, 12, ARENA.width - 24, ARENA.height - 24);
        ctx.strokeStyle = "rgba(226, 251, 255, 0.22)";
        ctx.lineWidth = 1.5;
        ctx.strokeRect(15, 15, ARENA.width - 30, ARENA.height - 30);

        ctx.strokeStyle = "rgba(190, 230, 255, 0.1)";
        ctx.lineWidth = 2;
        const seam = 40;
        ctx.beginPath();
        ctx.moveTo(15, 15);
        ctx.lineTo(15 + seam, 15 + seam);
        ctx.moveTo(ARENA.width - 15, 15);
        ctx.lineTo(ARENA.width - 15 - seam, 15 + seam);
        ctx.moveTo(15, ARENA.height - 15);
        ctx.lineTo(15 + seam, ARENA.height - 15 - seam);
        ctx.moveTo(ARENA.width - 15, ARENA.height - 15);
        ctx.lineTo(ARENA.width - 15 - seam, ARENA.height - 15 - seam);
        ctx.stroke();
      }

      function buildFishVariant(seed, regal = false) {
        const random = mulberry32(seed);
        const pick = (min, max) => lerp(min, max, random());
        const pattern = regal ? 0 : Math.floor(random() * 4);
        const patternSeeds = [random(), random(), random(), random(), random(), random()];
        return {
          bodyHeight: pick(0.66, 0.78),
          forkDepth: regal ? 0.55 : pick(0.25, 0.55),
          tailLobe: regal ? 1 : pick(0.6, 1),
          dorsalHeight: regal ? 0.55 : pick(0.35, 0.55),
          dorsalRake: pick(0.1, 0.4),
          dorsalPos: pick(-0.1, 0.15),
          pectoralSize: pick(0.28, 0.42),
          scaleRows: 2 + Math.floor(random() * 3),
          scaleStep: pick(0.3, 0.42),
          pattern,
          patternCount: 2 + Math.floor(random() * 3),
          patternSeeds,
          finAlpha: pick(0.5, 0.7),
          wagRate: pick(5.5, 7.5),
          wagPhase: pick(0, Math.PI * 2)
        };
      }

      function currentFishVariant() {
        if (!fishVariant || fishVariantKey !== foodLevel) {
          fishVariantKey = foodLevel;
          fishVariant = buildFishVariant((fishRunSeed + foodLevel * 7919) >>> 0);
        }
        return fishVariant;
      }

      function traceFishBody(radius, bodyH) {
        ctx.beginPath();
        ctx.moveTo(radius * 1.35, 0);
        ctx.bezierCurveTo(radius * 0.95, -bodyH * 1.02, -radius * 0.15, -bodyH * 1.05, -radius * 0.78, -radius * 0.24);
        ctx.quadraticCurveTo(-radius * 0.98, -radius * 0.1, -radius, 0);
        ctx.quadraticCurveTo(-radius * 0.98, radius * 0.1, -radius * 0.78, radius * 0.24);
        ctx.bezierCurveTo(-radius * 0.15, bodyH * 1.05, radius * 0.95, bodyH * 1.02, radius * 1.35, 0);
        ctx.closePath();
      }

      function drawFishShape(radius, main, accent, variant, glowColor, glowBlur) {
        const black = { r: 0, g: 0, b: 0 };
        const white = { r: 255, g: 255, b: 255 };
        const dorsalShade = mixRgb(main, black, 0.38);
        const bellyShade = mixRgb(main, white, 0.35);
        const bodyH = radius * variant.bodyHeight;
        const finColor = rgbaStr(accent, variant.finAlpha);
        const finRim = rgbaStr(mixRgb(accent, black, 0.3), 0.5);
        const wag = Math.sin(pulse * variant.wagRate + variant.wagPhase) * 0.22;

        ctx.save();
        ctx.translate(-radius, 0);
        ctx.rotate(wag);
        const tailLen = radius * 0.9;
        const lobe = radius * (0.55 + variant.tailLobe * 0.3);
        const notch = tailLen * (1 - variant.forkDepth);
        ctx.fillStyle = finColor;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.quadraticCurveTo(-tailLen * 0.45, -lobe * 0.25, -tailLen, -lobe);
        ctx.quadraticCurveTo(-notch * 0.85, -lobe * 0.28, -notch, 0);
        ctx.quadraticCurveTo(-notch * 0.85, lobe * 0.28, -tailLen, lobe);
        ctx.quadraticCurveTo(-tailLen * 0.45, lobe * 0.25, 0, 0);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = finRim;
        ctx.lineWidth = Math.max(0.6, radius * 0.05);
        ctx.stroke();
        ctx.restore();

        ctx.fillStyle = finColor;
        for (const finX of [radius * 0.1, -radius * 0.45]) {
          ctx.beginPath();
          ctx.moveTo(finX, bodyH * 0.55);
          ctx.quadraticCurveTo(finX - radius * 0.18, bodyH * 1.05, finX - radius * 0.34, bodyH * 0.7);
          ctx.closePath();
          ctx.fill();
        }

        const bodyGradient = ctx.createLinearGradient(0, -bodyH, 0, bodyH);
        bodyGradient.addColorStop(0, rgbaStr(dorsalShade, 1));
        bodyGradient.addColorStop(0.52, rgbaStr(main, 1));
        bodyGradient.addColorStop(1, rgbaStr(bellyShade, 1));
        ctx.shadowColor = glowColor;
        ctx.shadowBlur = glowBlur;
        traceFishBody(radius, bodyH);
        ctx.fillStyle = bodyGradient;
        ctx.fill();
        ctx.shadowBlur = 0;

        ctx.save();
        traceFishBody(radius, bodyH);
        ctx.clip();
        if (variant.pattern === 1) {
          ctx.fillStyle = rgbaStr(dorsalShade, 0.35);
          for (let b = 0; b < variant.patternCount; b += 1) {
            const barX = lerp(-radius * 0.7, radius * 0.75, variant.patternSeeds[b]);
            const barWidth = radius * (0.14 + variant.patternSeeds[5 - b] * 0.08);
            ctx.fillRect(barX - barWidth / 2, -bodyH, barWidth, bodyH * 2);
          }
        } else if (variant.pattern === 2) {
          ctx.fillStyle = rgbaStr(dorsalShade, 0.3);
          ctx.fillRect(-radius, -bodyH * 0.18, radius * 2.35, bodyH * 0.42);
        } else if (variant.pattern === 3) {
          ctx.fillStyle = rgbaStr(dorsalShade, 0.4);
          for (let s = 0; s < variant.patternCount + 2; s += 1) {
            const speckX = lerp(-radius * 0.75, radius * 0.8, variant.patternSeeds[s % 6]);
            const speckY = -bodyH * (0.15 + variant.patternSeeds[(s + 2) % 6] * 0.55);
            ctx.beginPath();
            ctx.arc(speckX, speckY, radius * (0.07 + variant.patternSeeds[(s + 4) % 6] * 0.05), 0, Math.PI * 2);
            ctx.fill();
          }
        }

        ctx.strokeStyle = rgbaStr(mixRgb(main, black, 0.5), 0.22);
        ctx.lineWidth = Math.max(0.5, radius * 0.045);
        const scaleStep = radius * variant.scaleStep;
        for (let row = 0; row < variant.scaleRows; row += 1) {
          const rowY = -bodyH * 0.45 + row * bodyH * (0.9 / Math.max(1, variant.scaleRows - 1));
          const rowOffset = row % 2 === 0 ? 0 : scaleStep * 0.5;
          for (let scaleX = -radius * 0.7 + rowOffset; scaleX < radius * 0.9; scaleX += scaleStep) {
            ctx.beginPath();
            ctx.arc(scaleX, rowY, scaleStep * 0.42, Math.PI * 0.15, Math.PI * 0.85);
            ctx.stroke();
          }
        }

        ctx.strokeStyle = rgbaStr(dorsalShade, 0.45);
        ctx.lineWidth = Math.max(0.7, radius * 0.06);
        ctx.beginPath();
        ctx.arc(radius * 0.98, 0, radius * 0.52, Math.PI * 0.6, Math.PI * 1.4);
        ctx.stroke();
        ctx.strokeStyle = rgbaStr(dorsalShade, 0.2);
        ctx.beginPath();
        ctx.arc(radius * 1.06, 0, radius * 0.6, Math.PI * 0.68, Math.PI * 1.32);
        ctx.stroke();

        ctx.strokeStyle = rgbaStr(mixRgb(main, black, 0.45), 0.16);
        ctx.lineWidth = Math.max(0.5, radius * 0.04);
        ctx.beginPath();
        ctx.moveTo(radius * 0.55, -radius * 0.05);
        ctx.quadraticCurveTo(-radius * 0.1, radius * 0.06, -radius * 0.9, -radius * 0.02);
        ctx.stroke();
        ctx.restore();

        const dorsalBase = radius * (0.15 + variant.dorsalPos);
        const dorsalTip = bodyH * (1 + variant.dorsalHeight);
        ctx.fillStyle = finColor;
        ctx.beginPath();
        ctx.moveTo(dorsalBase + radius * 0.42, -bodyH * 0.82);
        ctx.quadraticCurveTo(
          dorsalBase - radius * variant.dorsalRake,
          -dorsalTip,
          dorsalBase - radius * (0.5 + variant.dorsalRake),
          -bodyH * 0.7
        );
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = finRim;
        ctx.lineWidth = Math.max(0.5, radius * 0.04);
        ctx.beginPath();
        ctx.moveTo(dorsalBase + radius * 0.1, -bodyH * 0.85);
        ctx.lineTo(dorsalBase - radius * variant.dorsalRake * 0.6, -dorsalTip * 0.9);
        ctx.moveTo(dorsalBase - radius * 0.2, -bodyH * 0.8);
        ctx.lineTo(dorsalBase - radius * (0.3 + variant.dorsalRake * 0.8), -dorsalTip * 0.82);
        ctx.stroke();

        const pectoralFlutter = Math.sin(pulse * variant.wagRate * 1.3 + variant.wagPhase) * 0.15;
        ctx.save();
        ctx.translate(radius * 0.35, bodyH * 0.25);
        ctx.rotate(0.5 + pectoralFlutter);
        ctx.fillStyle = finColor;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.quadraticCurveTo(
          -radius * 0.1,
          radius * variant.pectoralSize,
          -radius * variant.pectoralSize * 1.4,
          radius * variant.pectoralSize * 0.9
        );
        ctx.quadraticCurveTo(-radius * 0.25, radius * variant.pectoralSize * 0.3, 0, 0);
        ctx.closePath();
        ctx.fill();
        ctx.restore();

        ctx.fillStyle = rgbaStr(bellyShade, 0.95);
        ctx.beginPath();
        ctx.arc(radius * 0.72, -radius * 0.16, radius * 0.16, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = rgbaStr(mixRgb(main, black, 0.55), 0.8);
        ctx.lineWidth = Math.max(0.5, radius * 0.035);
        ctx.stroke();
        ctx.fillStyle = "#03131f";
        ctx.beginPath();
        ctx.arc(radius * 0.74, -radius * 0.16, radius * 0.09, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "rgba(255, 255, 255, 0.85)";
        ctx.beginPath();
        ctx.arc(radius * 0.7, -radius * 0.2, Math.max(0.5, radius * 0.035), 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = rgbaStr(mixRgb(main, black, 0.5), 0.55);
        ctx.lineWidth = Math.max(0.6, radius * 0.045);
        ctx.beginPath();
        ctx.moveTo(radius * 1.32, radius * 0.05);
        ctx.quadraticCurveTo(radius * 1.16, radius * 0.1, radius * 1.05, radius * 0.08);
        ctx.stroke();
      }

      function drawFood() {
        const radius = foodRadius() + Math.sin(pulse * 4) * 1.2 * snakeScale();
        const theme = currentFoodTheme();
        const pal = ARENA_PALETTES[foodLevel % ARENA_PALETTES.length];
        const angle = Math.atan2(foodVelocity.y, foodVelocity.x);
        ctx.save();
        ctx.translate(food.x, food.y);
        ctx.rotate(angle);
        drawFishShape(radius, pal.glow, pal.accent, currentFishVariant(), theme.glow, 22);
        ctx.restore();
      }

      function drawBonusFood() {
        if (!bonusFood) return;
        const scale = snakeScale();
        const radius = bonusRadius() + Math.sin(pulse * 8) * 1.8 * scale;
        const angle = smoothBonusAngle();
        ctx.save();
        ctx.translate(bonusFood.x, bonusFood.y);
        ctx.rotate(angle);
        ctx.shadowColor = "rgba(201, 167, 255, 0.95)";
        ctx.shadowBlur = 28;

        const aura = ctx.createRadialGradient(0, 0, radius * 0.4, 0, 0, radius * 2.8);
        aura.addColorStop(0, "rgba(247, 251, 255, 0.28)");
        aura.addColorStop(0.45, "rgba(201, 167, 255, 0.2)");
        aura.addColorStop(1, "rgba(201, 167, 255, 0)");
        ctx.fillStyle = aura;
        ctx.beginPath();
        ctx.arc(0, 0, radius * 2.8, 0, Math.PI * 2);
        ctx.fill();

        if (!bonusFishVariant) {
          bonusFishVariant = buildFishVariant((fishRunSeed ^ 0x5eed) >>> 0, true);
        }
        drawFishShape(radius, MAGIC_FISH_MAIN, MAGIC_FISH_ACCENT, bonusFishVariant, "rgba(201, 167, 255, 0.95)", 28);

        ctx.strokeStyle = "rgba(247, 251, 255, 0.75)";
        ctx.lineWidth = Math.max(0.8, 1.4 * scale);
        for (let i = -1; i <= 1; i += 1) {
          ctx.beginPath();
          ctx.moveTo(-radius * 0.36, i * radius * 0.25);
          ctx.quadraticCurveTo(radius * 0.12, i * radius * 0.44, radius * 0.62, i * radius * 0.18);
          ctx.stroke();
        }
        ctx.restore();
      }

      function drawBiteParticles() {
        if (!biteParticles || !biteParticles.length) return;

        ctx.save();
        ctx.globalCompositeOperation = "screen";
        biteParticles.forEach((particle) => {
          const progress = particle.age / particle.life;
          const alpha = Math.pow(1 - progress, 1.35);
          const radius = lerp(particle.r, particle.maxR, Math.min(1, progress * 1.35));

          ctx.globalAlpha = alpha * (particle.bubble ? 0.72 : 0.9);
          ctx.shadowColor = particle.glow;
          ctx.shadowBlur = radius * 2.4;

          if (particle.bubble) {
            ctx.strokeStyle = particle.color;
            ctx.lineWidth = Math.max(0.8, radius * 0.25);
            ctx.beginPath();
            ctx.arc(particle.x, particle.y, radius, 0, Math.PI * 2);
            ctx.stroke();

            ctx.globalAlpha = alpha * 0.28;
            ctx.fillStyle = "rgba(247, 251, 255, 0.82)";
            ctx.beginPath();
            ctx.arc(particle.x - radius * 0.25, particle.y - radius * 0.28, Math.max(0.8, radius * 0.24), 0, Math.PI * 2);
            ctx.fill();
          } else {
            ctx.fillStyle = particle.color;
            ctx.beginPath();
            ctx.arc(particle.x, particle.y, radius * (0.62 + progress * 0.18), 0, Math.PI * 2);
            ctx.fill();
          }
        });
        ctx.restore();
      }

      function drawInvincibleField() {
        if (!isInvincibleMode() || snake.length < 2) return;

        const shimmer = 0.55 + Math.sin(pulse * 8) * 0.18;
        const warning = isInvincibilityWarningActive();
        ctx.save();
        ctx.globalCompositeOperation = "screen";

        for (let pass = 0; pass < 2; pass += 1) {
          ctx.beginPath();
          snake.forEach((part, index) => {
            if (index === 0) ctx.moveTo(part.x, part.y);
            else ctx.lineTo(part.x, part.y);
          });
          ctx.lineCap = "round";
          ctx.lineJoin = "round";
          ctx.strokeStyle = pass === 0
            ? (warning ? `rgba(255, 207, 90, ${0.14 + shimmer * 0.16})` : `rgba(201, 167, 255, ${0.12 + shimmer * 0.12})`)
            : (warning ? `rgba(255, 143, 171, ${0.18 + shimmer * 0.16})` : `rgba(126, 231, 255, ${0.16 + shimmer * 0.14})`);
          ctx.lineWidth = (pass === 0 ? bodyRadius() * 5.2 : bodyRadius() * 2.7);
          ctx.setLineDash(pass === 0 ? [] : [10, 16]);
          ctx.lineDashOffset = -pulse * 46;
          ctx.stroke();
        }

        for (let i = 4; i < snake.length; i += 7) {
          const part = snake[i];
          const ring = bodyRadius() * (2.3 + Math.sin(pulse * 5 + i) * 0.35);
          ctx.globalAlpha = 0.12 + shimmer * 0.08;
          ctx.strokeStyle = warning
            ? (i % 2 === 0 ? "rgba(255, 207, 90, 0.85)" : "rgba(255, 143, 171, 0.75)")
            : (i % 2 === 0 ? "rgba(201, 167, 255, 0.8)" : "rgba(126, 231, 255, 0.7)");
          ctx.lineWidth = Math.max(1, bodyRadius() * 0.16);
          ctx.beginPath();
          ctx.ellipse(part.x, part.y, ring * 1.35, ring * 0.62, pulse + i, 0, Math.PI * 2);
          ctx.stroke();
        }

        ctx.restore();
        ctx.setLineDash([]);
        ctx.globalAlpha = 1;
      }

      function drawTailFin(deadTime) {
        if (!snake || snake.length < 2) return;
        const tail = snake[snake.length - 1];
        let anchor = null;
        for (let i = snake.length - 2; i >= 0; i -= 1) {
          if (dist(snake[i], tail) > 1) {
            anchor = snake[i];
            break;
          }
        }
        const angle = anchor
          ? Math.atan2(tail.y - anchor.y, tail.x - anchor.x)
          : Math.atan2(-heading.y, -heading.x);
        const size = bodyRadius();
        const length = size * 4.4;
        const width = size * 1.5;
        const grayMix = deadTime >= 0 ? clamp((deadTime - DEATH_GRAY_STAGGER) / 0.25, 0, 1) : 0;
        const flutter = deadTime >= 0 ? 0 : Math.sin(pulse * 3.2) * length * 0.18;

        ctx.save();
        ctx.translate(tail.x, tail.y);
        ctx.rotate(angle);
        ctx.fillStyle = `hsl(180 ${Math.round(62 - grayMix * 54)}% ${Math.round(34 - grayMix * 6)}%)`;
        ctx.globalAlpha = 0.9;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.quadraticCurveTo(length * 0.45, -width, length, flutter);
        ctx.quadraticCurveTo(length * 0.45, width, 0, 0);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = "#ffd166";
        ctx.lineWidth = Math.max(1, size * 0.18);
        ctx.globalAlpha = 0.55 * (1 - grayMix);
        ctx.stroke();
        ctx.strokeStyle = "rgba(226, 251, 255, 0.18)";
        ctx.lineWidth = Math.max(1, size * 0.12);
        ctx.globalAlpha = 1 - grayMix * 0.7;
        ctx.beginPath();
        ctx.moveTo(size * 0.4, 0);
        ctx.quadraticCurveTo(length * 0.5, flutter * 0.4, length * 0.82, flutter * 0.8);
        ctx.stroke();
        ctx.restore();
      }

      function drawSnake() {
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        const invincible = isInvincibleMode();
        const warning = isInvincibilityWarningActive();
        const invinciblePulse = invincible ? 0.55 + Math.sin(pulse * 9) * 0.18 : 0;
        const headSize = headRadius();
        const bodySize = bodyRadius();

        if (invincible) {
          drawInvincibleField();
        }

        const deadTime = deathAt >= 0 ? pulse - deathAt : -1;
        drawTailFin(deadTime);

        for (let i = snake.length - 1; i > 0; i -= 1) {
          const part = snake[i];
          const t = i / snake.length;
          let radiusMul = 1;
          for (let b = 0; b < swallowBulges.length; b += 1) {
            const bulgeDist = Math.abs(i - swallowBulges[b].pos);
            if (bulgeDist < BULGE_WIDTH_SEGMENTS) {
              const k = 1 - bulgeDist / BULGE_WIDTH_SEGMENTS;
              radiusMul = Math.max(radiusMul, 1 + 0.42 * k * k * (3 - 2 * k));
            }
          }
          const radius = bodySize * (0.82 + (1 - t) * 0.22) * radiusMul;
          const hueMix = Math.round(180 + (1 - t) * 20);
          const grayMix = deadTime >= 0 ? clamp((deadTime - t * DEATH_GRAY_STAGGER) / 0.25, 0, 1) : 0;

          if (invincible && i % 2 === 0) {
            ctx.fillStyle = `rgba(201, 167, 255, ${0.16 + invinciblePulse * 0.16})`;
            ctx.beginPath();
            ctx.arc(part.x, part.y, radius * 1.78, 0, Math.PI * 2);
            ctx.fill();
          }

          ctx.fillStyle = `hsl(${hueMix} ${Math.round(62 - grayMix * 54)}% ${Math.round(34 + (1 - t) * 16 - grayMix * 6)}%)`;
          ctx.beginPath();
          ctx.arc(part.x, part.y, radius, 0, Math.PI * 2);
          ctx.fill();

          if (i % 3 === 1 || i % 7 === 3) {
            const spotSeed = i * 53 + 11;
            ctx.fillStyle = `hsl(${hueMix + 14} ${Math.round(66 - grayMix * 58)}% ${Math.round(22 - grayMix * 2)}%)`;
            ctx.globalAlpha = 0.6;
            ctx.beginPath();
            if (i % 3 === 1) {
              const spotAngle = ((spotSeed % 7) / 7) * Math.PI * 2;
              ctx.arc(
                part.x + Math.cos(spotAngle) * radius * 0.3,
                part.y + Math.sin(spotAngle) * radius * 0.3,
                radius * (0.32 + (spotSeed % 3) * 0.08),
                0,
                Math.PI * 2
              );
            }
            if (i % 7 === 3) {
              const smallAngle = ((spotSeed % 5) / 5) * Math.PI * 2;
              ctx.arc(
                part.x + Math.cos(smallAngle) * radius * 0.42,
                part.y + Math.sin(smallAngle) * radius * 0.42,
                radius * 0.2,
                0,
                Math.PI * 2
              );
            }
            ctx.fill();
            ctx.globalAlpha = 1;
          }

          ctx.strokeStyle = `rgba(214, 244, 228, ${0.1 * (1 - grayMix)})`;
          ctx.lineWidth = Math.max(1, radius * 0.3);
          ctx.beginPath();
          ctx.arc(part.x, part.y, radius * 0.78, Math.PI * 0.35, Math.PI * 0.95);
          ctx.stroke();

          ctx.fillStyle = `rgba(255, 255, 255, ${0.12 * (1 - grayMix)})`;
          ctx.beginPath();
          ctx.arc(part.x - radius * 0.28, part.y - radius * 0.32, Math.max(1.5, radius * 0.18), 0, Math.PI * 2);
          ctx.fill();
        }

        const head = snake[0];
        const next = snake[1] || { x: head.x - 1, y: head.y };
        const angle = Math.atan2(head.y - next.y, head.x - next.x);
        const dead = gameState === "over";
        const pal = dead
          ? HEAD_STATE_COLORS.dead
          : warning
            ? HEAD_STATE_COLORS.warning
            : invincible
              ? HEAD_STATE_COLORS.invincible
              : HEAD_STATE_COLORS.normal;

        const gulpT = clamp((pulse - gulpAt) / GULP_DURATION, 0, 1);
        const gulp = gulpT < 1 ? Math.sin(gulpT * Math.PI) * (1 - gulpT * 0.4) : 0;

        let mouthOpen = 0;
        if (!dead && gulpT >= 1) {
          let nearest = dist(head, food);
          if (bonusFood) nearest = Math.min(nearest, dist(head, bonusFood));
          mouthOpen = clamp(1 - (nearest - headSize * 1.3) / (headSize * 3.2), 0, 1);
        }

        const blinkT = clamp((pulse - blinkStartedAt) / BLINK_DURATION, 0, 1);
        const blink = blinkT < 1 ? Math.sin(blinkT * Math.PI) : 0;
        const squinting = !dead && pulse < squintUntil;

        ctx.save();
        ctx.translate(head.x, head.y);
        ctx.rotate(angle);
        ctx.scale(1 - 0.16 * gulp, 1 + 0.2 * gulp);

        const finFlutter = dead ? 0 : Math.sin(pulse * 6) * headSize * 0.08;
        const finDroop = dead ? headSize * 0.2 : 0;
        ctx.strokeStyle = "#ffd166";
        ctx.lineWidth = Math.max(1, headSize * 0.05);
        for (let side = -1; side <= 1; side += 2) {
          ctx.beginPath();
          ctx.moveTo(-headSize * 0.15, side * headSize * 0.55);
          ctx.quadraticCurveTo(
            -headSize * 0.7,
            side * (headSize * 1.15 + finDroop),
            -headSize + finFlutter,
            side * (headSize * 1.25 + finDroop)
          );
          ctx.quadraticCurveTo(-headSize * 0.75, side * headSize * 0.7, -headSize * 0.35, side * headSize * 0.45);
          ctx.closePath();
          ctx.fillStyle = pal.dark;
          ctx.globalAlpha = 0.85;
          ctx.fill();
          ctx.globalAlpha = dead ? 0.25 : 0.55;
          ctx.stroke();
        }
        ctx.globalAlpha = 1;

        ctx.shadowColor = pal.glow;
        ctx.shadowBlur = invincible ? 30 : 18;
        const headGradient = ctx.createRadialGradient(
          -headSize * 0.15,
          -headSize * 0.4,
          headSize * 0.15,
          0,
          0,
          headSize * 1.5
        );
        headGradient.addColorStop(0, pal.light);
        headGradient.addColorStop(0.55, pal.base);
        headGradient.addColorStop(1, pal.dark);
        ctx.fillStyle = headGradient;
        ctx.beginPath();
        ctx.moveTo(headSize * 1.3, 0);
        ctx.bezierCurveTo(headSize * 1.05, -headSize * 0.72, headSize * 0.2, -headSize * 1.05, -headSize * 0.45, -headSize * 0.9);
        ctx.bezierCurveTo(-headSize * 1.15, -headSize * 0.6, -headSize * 1.15, headSize * 0.6, -headSize * 0.45, headSize * 0.9);
        ctx.bezierCurveTo(headSize * 0.2, headSize * 1.05, headSize * 1.05, headSize * 0.72, headSize * 1.3, 0);
        ctx.closePath();
        ctx.fill();
        ctx.shadowBlur = 0;

        if (invincible) {
          ctx.save();
          ctx.globalCompositeOperation = "screen";
          ctx.strokeStyle = "rgba(126, 231, 255, 0.72)";
          ctx.lineWidth = Math.max(1.2, headSize * 0.13);
          for (let i = 0; i < 2; i += 1) {
            const radius = headSize * (1.55 + i * 0.42 + Math.sin(pulse * 6 + i) * 0.1);
            ctx.beginPath();
            ctx.ellipse(0, 0, radius * 1.18, radius * 0.84, pulse * (i ? -1.4 : 1.6), 0, Math.PI * 2);
            ctx.stroke();
          }
          ctx.restore();
        }

        if (mouthOpen > 0.02) {
          const halfAngle = mouthOpen * 0.55;
          ctx.fillStyle = "#06222f";
          ctx.beginPath();
          ctx.moveTo(headSize * 0.45, 0);
          ctx.arc(headSize * 0.45, 0, headSize * 0.9, -halfAngle, halfAngle);
          ctx.closePath();
          ctx.fill();
          ctx.strokeStyle = pal.dark;
          ctx.lineWidth = Math.max(1, headSize * 0.06);
          ctx.stroke();
        } else if (!dead) {
          ctx.strokeStyle = pal.dark;
          ctx.lineWidth = Math.max(1, headSize * 0.06);
          ctx.beginPath();
          ctx.moveTo(headSize * 0.75, headSize * 0.16);
          ctx.quadraticCurveTo(headSize * 1.05, headSize * 0.26, headSize * 1.22, headSize * 0.1);
          ctx.stroke();
        }

        ctx.fillStyle = "#06121b";
        ctx.globalAlpha = 0.75;
        ctx.beginPath();
        ctx.arc(headSize * 1.02, -headSize * 0.18, Math.max(0.8, headSize * 0.05), 0, Math.PI * 2);
        ctx.arc(headSize * 1.02, headSize * 0.18, Math.max(0.8, headSize * 0.05), 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;

        const heartSize = headSize * 0.13;
        const heartX = headSize * 0.02;
        ctx.fillStyle = pal.dark;
        ctx.globalAlpha = 0.3;
        ctx.beginPath();
        ctx.moveTo(heartX + heartSize, 0);
        ctx.bezierCurveTo(
          heartX + heartSize * 0.35,
          -heartSize * 1.05,
          heartX - heartSize * 1.3,
          -heartSize * 0.7,
          heartX - heartSize * 0.3,
          0
        );
        ctx.bezierCurveTo(
          heartX - heartSize * 1.3,
          heartSize * 0.7,
          heartX + heartSize * 0.35,
          heartSize * 1.05,
          heartX + heartSize,
          0
        );
        ctx.closePath();
        ctx.fill();
        ctx.globalAlpha = 1;

        ctx.strokeStyle = pal.dark;
        ctx.globalAlpha = 0.5;
        ctx.lineWidth = Math.max(1, headSize * 0.07);
        for (let side = -1; side <= 1; side += 2) {
          for (let g = 0; g < 2; g += 1) {
            const gillX = -headSize * (0.1 + g * 0.26);
            ctx.beginPath();
            ctx.moveTo(gillX, side * headSize * 0.28);
            ctx.quadraticCurveTo(
              gillX - headSize * 0.18,
              side * headSize * 0.5,
              gillX - headSize * 0.05,
              side * headSize * 0.72
            );
            ctx.stroke();
          }
        }
        ctx.globalAlpha = 1;

        const eyeX = headSize * 0.38;
        const eyeY = headSize * 0.42;
        if (dead) {
          ctx.strokeStyle = "#2b0d12";
          ctx.lineWidth = Math.max(1.4, headSize * 0.09);
          const arm = headSize * 0.2;
          for (let side = -1; side <= 1; side += 2) {
            const ey = side * eyeY;
            ctx.beginPath();
            ctx.moveTo(eyeX - arm, ey - arm);
            ctx.lineTo(eyeX + arm, ey + arm);
            ctx.moveTo(eyeX + arm, ey - arm);
            ctx.lineTo(eyeX - arm, ey + arm);
            ctx.stroke();
          }
        } else if (squinting) {
          ctx.strokeStyle = "#06121b";
          ctx.lineWidth = Math.max(1.4, headSize * 0.09);
          for (let side = -1; side <= 1; side += 2) {
            ctx.beginPath();
            ctx.arc(eyeX, side * eyeY + headSize * 0.1, headSize * 0.22, Math.PI * 1.15, Math.PI * 1.85);
            ctx.stroke();
          }
        } else {
          const blinkFactor = Math.max(0.08, 1 - blink * 0.92);
          const foodAngle = Math.atan2(food.y - head.y, food.x - head.x) - angle;
          const pupilScale = mouthOpen > 0.6 ? 1.15 : 1;
          const irisX = Math.cos(foodAngle) * headSize * 0.06;
          const irisY = Math.sin(foodAngle) * headSize * 0.06;
          for (let side = -1; side <= 1; side += 2) {
            ctx.save();
            ctx.translate(eyeX, side * eyeY);
            ctx.rotate(side * 0.35);
            ctx.scale(1, blinkFactor);

            ctx.beginPath();
            ctx.ellipse(0, 0, headSize * 0.3, headSize * 0.22, 0, 0, Math.PI * 2);
            ctx.fillStyle = "#eef8ff";
            ctx.fill();
            ctx.strokeStyle = "#0b2438";
            ctx.lineWidth = Math.max(1, headSize * 0.06);
            ctx.stroke();

            ctx.save();
            ctx.clip();
            ctx.fillStyle = "#1d4f8c";
            ctx.beginPath();
            ctx.arc(irisX, irisY, headSize * 0.19, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "#2a69b0";
            ctx.beginPath();
            ctx.arc(irisX, irisY + headSize * 0.045, headSize * 0.165, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "#071827";
            ctx.beginPath();
            ctx.arc(irisX, irisY, Math.max(1.2, headSize * 0.11) * pupilScale, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "rgba(255, 255, 255, 0.9)";
            ctx.beginPath();
            ctx.arc(irisX - headSize * 0.055, irisY - headSize * 0.06, Math.max(0.9, headSize * 0.055), 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "rgba(255, 255, 255, 0.6)";
            ctx.beginPath();
            ctx.arc(irisX + headSize * 0.06, irisY + headSize * 0.05, Math.max(0.6, headSize * 0.028), 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            const lidStart = side > 0 ? Math.PI * 0.15 : Math.PI * 1.15;
            ctx.strokeStyle = pal.dark;
            ctx.lineWidth = Math.max(1.2, headSize * 0.08);
            ctx.beginPath();
            ctx.ellipse(0, 0, headSize * 0.3, headSize * 0.22, 0, lidStart, lidStart + Math.PI * 0.7);
            ctx.stroke();

            ctx.restore();
          }
        }

        const tongueT = clamp((pulse - tongueStartedAt) / TONGUE_FLICK_DURATION, 0, 1);
        if (!dead && tongueT < 1 && mouthOpen < 0.5) {
          const ext = Math.sin(tongueT * Math.PI);
          const waggle = Math.sin(pulse * 30) * headSize * 0.05;
          ctx.strokeStyle = "#ffd166";
          ctx.lineWidth = Math.max(1.2, 2 * snakeScale());
          ctx.beginPath();
          ctx.moveTo(headSize * 0.95, 0);
          ctx.lineTo(headSize * (0.95 + 0.55 * ext), -headSize * 0.24 * ext + waggle);
          ctx.moveTo(headSize * 0.95, 0);
          ctx.lineTo(headSize * (0.95 + 0.55 * ext), headSize * 0.24 * ext + waggle);
          ctx.stroke();
        }
        ctx.restore();
      }

      function drawTargetLine() {
        if (!dragging || gameState !== "playing" || paused) return;
        const head = snake[0];
        ctx.save();
        ctx.strokeStyle = "rgba(139, 211, 255, 0.38)";
        ctx.lineWidth = 2;
        ctx.setLineDash([8, 12]);
        ctx.beginPath();
        ctx.moveTo(head.x, head.y);
        ctx.lineTo(target.x, target.y);
        ctx.stroke();
        ctx.restore();
      }

      function drawScorePopups() {
        if (!scorePopups || !scorePopups.length) return;

        const fontSize = Math.max(13, Math.round(17 * snakeScale() + 4));
        ctx.save();
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.font = `600 ${fontSize}px Sora, ui-sans-serif, system-ui, sans-serif`;
        scorePopups.forEach((popup) => {
          const progress = popup.age / popup.life;
          const fadeIn = Math.min(1, progress / 0.12);
          const fadeOut = Math.pow(1 - Math.max(0, (progress - 0.12) / 0.88), 1.3);
          ctx.globalAlpha = fadeIn * fadeOut;
          ctx.shadowColor = popup.glow;
          ctx.shadowBlur = 14;
          ctx.strokeStyle = "rgba(3, 19, 31, 0.55)";
          ctx.lineWidth = 3;
          ctx.strokeText(popup.text, popup.x, popup.y);
          ctx.fillStyle = popup.color;
          ctx.fillText(popup.text, popup.x, popup.y);
        });
        ctx.restore();
      }

      function drawGlassReflections() {
        ctx.save();
        ctx.globalCompositeOperation = "screen";
        ctx.fillStyle = "rgba(226, 251, 255, 1)";
        const slant = ARENA.width * 0.12;
        const anchors = [0.18, 0.55];
        const widths = [0.07, 0.035];
        for (let i = 0; i < anchors.length; i += 1) {
          const streakX = ARENA.width * anchors[i];
          const streakW = ARENA.width * widths[i];
          ctx.globalAlpha = GLASS_STREAK_ALPHAS[i];
          ctx.beginPath();
          ctx.moveTo(streakX, 0);
          ctx.lineTo(streakX + streakW, 0);
          ctx.lineTo(streakX + streakW + slant, ARENA.height);
          ctx.lineTo(streakX + slant, ARENA.height);
          ctx.closePath();
          ctx.fill();
        }
        ctx.restore();
      }

      function drawDeathFlash(deadTime) {
        if (!(deadTime < DEATH_FLASH_DURATION)) return;
        const fade = 1 - deadTime / DEATH_FLASH_DURATION;
        const centerX = ARENA.width * 0.5;
        const centerY = ARENA.height * 0.5;
        const outer = Math.hypot(centerX, centerY);
        const gradient = ctx.createRadialGradient(centerX, centerY, outer * 0.35, centerX, centerY, outer);
        gradient.addColorStop(0, "rgba(255, 70, 80, 0)");
        gradient.addColorStop(1, `rgba(255, 70, 80, ${0.4 * fade})`);
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, ARENA.width, ARENA.height);
      }

      function draw() {
        const deadTime = deathAt >= 0 ? pulse - deathAt : Infinity;
        const shaken = deadTime < DEATH_SHAKE_DURATION;
        if (shaken) {
          const amp = 9 * snakeScale() * (1 - deadTime / DEATH_SHAKE_DURATION);
          ctx.save();
          ctx.translate(Math.sin(deadTime * 68) * amp, Math.cos(deadTime * 83) * amp * 0.7);
        }
        drawArena();
        drawFood();
        drawBonusFood();
        drawBiteParticles();
        drawTargetLine();
        drawSnake();
        drawScorePopups();
        if (shaken) {
          ctx.restore();
        }
        drawGlassReflections();
        drawDeathFlash(deadTime);
      }

      function setPaused(nextPaused, reason = "manual") {
        if (gameState === "over" || paused === nextPaused) return false;

        const now = performance.now();
        paused = nextPaused;
        updatePauseIcon();
        if (paused) {
          pauseStartedAt = now;
          cancelCanvasDrag();
          resetJoystick();
          resetGamepadControl();
          resetControllerTouch();
          stopHaptics();
          suspendGameAudio();
          if (reason === "lifecycle") {
            setOverlay("pause", "Paused", "The game moved into the background. Resume when you're ready.");
            setStatus("Paused in background", "#8bd3ff");
          } else {
            setOverlay("pause", "Paused", "The arena is holding its breath.");
            setStatus("Paused", "#8bd3ff");
          }
        } else {
          const pausedFor = pauseStartedAt ? Math.max(0, now - pauseStartedAt) : 0;
          if (comboExpiresAt > 0) comboExpiresAt += pausedFor;
          if (invincibleWarningUntil > 0) invincibleWarningUntil += pausedFor;
          if (invincibleUntil > 0) invincibleUntil += pausedFor;
          pauseStartedAt = 0;
          lastFrame = now;
          frameDeltaSeconds = 0;
          setOverlay(null);
          setStatus(gameState === "ready" ? "Ready" : "Hunting", "#31d0aa");
          resumeGameAudio();
        }
        return true;
      }

      function togglePause() {
        setPaused(!paused);
      }

      function pauseForLifecycle() {
        lastFrame = performance.now();
        frameDeltaSeconds = 0;
        cancelCanvasDrag();
        resetJoystick();
        resetGamepadControl();
        resetControllerTouch();
        stopHaptics();

        if (gameState === "playing" && !paused) {
          setPaused(true, "lifecycle");
        } else {
          suspendGameAudio();
        }
      }

      function returnFromLifecycle() {
        lastFrame = performance.now();
        frameDeltaSeconds = 0;
        if (!paused) {
          resumeGameAudio();
        }
      }

      function handleVisibilityChange() {
        if (document.hidden) {
          pauseForLifecycle();
        } else {
          returnFromLifecycle();
        }
      }

      function simulateGameplay(dt) {
        if (joystickActive) {
          moveHeadWithJoystick(dt);
        } else if (controllerTouchState.active) {
          moveHeadTowardTarget(dt);
        } else if (gamepadActive) {
          moveHeadWithGamepad(dt);
        } else if (dragging) {
          moveHeadTowardTarget();
        } else {
          moveHeadIdle(dt);
        }

        if (gameState === "playing") {
          moveFood(dt);
          moveBonusFood(dt);
          checkFood();
          settleInvincibilityBites();
        }
      }

      function frame(now) {
        const dt = Math.min(
          MAX_FRAME_DELTA_SECONDS,
          Math.max(0, (now - lastFrame) / 1000)
        );
        lastFrame = now;
        frameDeltaSeconds = dt;
        pulse += dt;
        pollGamepad();
        if (!paused) {
          expireComboIfNeeded();
          updateInvincibilityWarning();
        }

        if (!paused) {
          moveOcean(dt);
          updateBiteParticles(dt);
          updateScorePopups(dt);
          updateHeadFx(dt);
        }

        if (gameState === "playing" && !paused) {
          headMotion = 0;
          let remainingTime = dt;
          while (remainingTime > 0.000001 && gameState === "playing" && !paused) {
            const simulationStep = Math.min(MAX_SIMULATION_STEP_SECONDS, remainingTime);
            simulateGameplay(simulationStep);
            remainingTime -= simulationStep;
          }
        }

        draw();
        requestAnimationFrame(frame);
      }

      function toggleMute() {
        muted = !muted;
        writeStoredFlag(MUTED_STORAGE_KEY, muted);
        if (!muted) {
          unlockSfxAudio();
        }
        syncMusicMute();
      }

      function toggleHaptics() {
        hapticsEnabled = !hapticsEnabled;
        try {
          localStorage.setItem(HAPTICS_STORAGE_KEY, String(hapticsEnabled));
        } catch (error) {}
        if (!hapticsEnabled) stopHaptics();
        updateHapticsIcon();
        setStatus(hapticsEnabled ? "Haptics on" : "Haptics off", "#8bd3ff");
      }

      pauseBtn.addEventListener("click", togglePause);
      muteBtn.addEventListener("click", toggleMute);
      hapticsBtn.addEventListener("click", toggleHaptics);
      dualSenseBtn.addEventListener("click", requestOrTestDualSenseDevice);
      restartBtn.addEventListener("click", reset);
      joystick.addEventListener("pointerdown", startJoystick);
      joystick.addEventListener("pointermove", moveJoystick);
      joystick.addEventListener("pointerup", endJoystick);
      joystick.addEventListener("pointercancel", endJoystick);
      joystick.addEventListener("contextmenu", (event) => event.preventDefault());
      canvas.addEventListener("pointerdown", startDrag);
      canvas.addEventListener("pointermove", moveDrag);
      canvas.addEventListener("pointerup", endDrag);
      canvas.addEventListener("pointercancel", endDrag);
      canvas.addEventListener("pointerleave", (event) => {
        if (dragging && event.buttons === 0) endDrag(event);
      });
      window.addEventListener("keydown", steerWithKey);
      window.addEventListener("keydown", handleActionKey);
      window.addEventListener("gamepadconnected", handleGamepadConnected);
      window.addEventListener("gamepaddisconnected", handleGamepadDisconnected);
      if ("hid" in navigator && navigator.hid.addEventListener) {
        navigator.hid.addEventListener("connect", handleHidConnect);
        navigator.hid.addEventListener("disconnect", handleHidDisconnect);
      }
      window.addEventListener("resize", scheduleArenaSync);
      window.addEventListener("orientationchange", scheduleArenaSync);
      window.addEventListener("blur", pauseForLifecycle);
      window.addEventListener("focus", returnFromLifecycle);
      document.addEventListener("visibilitychange", handleVisibilityChange);
      window.addEventListener("pagehide", pauseForLifecycle);
      window.addEventListener("pageshow", returnFromLifecycle);
      if (MOBILE_LAYOUT_QUERY.addEventListener) {
        MOBILE_LAYOUT_QUERY.addEventListener("change", scheduleArenaSync);
      }

      syncArenaSize();
      reset();
      syncMusicMute();
      updateControllerCapabilities(selectGamepad());
      updateHapticsAvailability();
      restoreDualSenseDevice();
      requestAnimationFrame(frame);

      if ("serviceWorker" in navigator && window.isSecureContext) {
        let reloadingForServiceWorker = false;
        navigator.serviceWorker.addEventListener("controllerchange", () => {
          if (reloadingForServiceWorker) return;
          reloadingForServiceWorker = true;
          window.location.reload();
        });
        window.addEventListener("load", () => {
          const serviceWorkerPath = "./service-worker" + ".js";
          navigator.serviceWorker.register(serviceWorkerPath, { updateViaCache: "none" })
            .then((registration) => registration.update())
            .catch(() => {});
        });
      }
    })();
  </script>
</body>
